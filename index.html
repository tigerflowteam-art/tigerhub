<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TigerHub</title>
<!-- Icônes intégrées directement dans le fichier, aucune dépendance externe -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --th-bg:#F6F5F8;
  --th-bg-alt:#EFEEF4;
  --th-sidebar:#1B1523;
  --th-sidebar-2:#241D2E;
  --th-card:#FFFFFF;
  --th-text:#1A1523;
  --th-text-2:#6E6A7A;
  --th-text-3:#9793A3;
  --th-border:#E9E7EF;
  --th-orange:#F97316;
  --th-orange-2:#FB8B3D;
  --th-orange-bg:#FFF1E7;
  --th-blue:#3B82F6;
  --th-blue-bg:#EAF1FE;
  --th-red:#EF4444;
  --th-red-bg:#FEECEC;
  --th-green:#16A34A;
  --th-green-bg:#EAFAF0;
  --th-purple:#8B5CF6;
  --th-purple-bg:#F3EEFE;
  --th-shadow:0 1px 2px rgba(26,21,35,0.04), 0 8px 24px -8px rgba(26,21,35,0.10);
  --th-shadow-sm:0 1px 2px rgba(26,21,35,0.05);
  --th-shadow-lg:0 20px 48px -16px rgba(26,21,35,0.22);
}
*{box-sizing:border-box;margin:0;padding:0}
.icon{display:inline-block;vertical-align:-3px;flex-shrink:0}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1100px 520px at 100% -10%, rgba(249,115,22,0.07), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(139,92,246,0.05), transparent 55%),
    var(--th-bg);
  color:var(--th-text);
  display:flex;
  min-height:100vh;
  letter-spacing:-0.01em;
}
::selection{background:var(--th-orange-bg);color:var(--th-orange)}

#app{flex:1;min-width:0;display:flex}

/* Sidebar */
#sidebar{
  width:216px;flex-shrink:0;
  background:linear-gradient(185deg, var(--th-sidebar-2) 0%, var(--th-sidebar) 100%);
  padding:22px 12px 16px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.logo{
  display:flex;align-items:center;gap:9px;
  font-weight:700;font-size:15.5px;padding:2px 10px;margin-bottom:22px;color:#fff;
}
.logo-mark{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg, var(--th-orange) 0%, #FDBA74 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px -2px rgba(249,115,22,0.55);
}
.logo-mark svg{width:14px;height:14px}
.logo span{color:var(--th-orange-2)}
.nav-group-title{
  display:flex;align-items:center;gap:7px;
  font-size:11px;color:rgba(255,255,255,0.5);font-weight:700;
  padding:0 10px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.06em;
}
.nav-group-title:first-of-type{margin-top:2px}
.nav-group-title::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--th-orange-2);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(249,115,22,0.18);
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:9px;
  font-size:13px;color:rgba(255,255,255,0.62);margin-bottom:1px;cursor:pointer;
  font-weight:500;transition:background .12s ease,color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.92)}
.nav-item.active{
  background:linear-gradient(135deg, var(--th-orange) 0%, #EA6A0C 100%);
  color:#fff;font-weight:600;
  box-shadow:0 6px 16px -4px rgba(249,115,22,0.6);
}
.nav-item i{font-size:16px;flex-shrink:0}
.sidebar-foot{
  margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;gap:9px;
}
.sidebar-avatar{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#FDBA74,var(--th-orange));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;
}
.sidebar-user{min-width:0}
.sidebar-user .name{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .role{font-size:10.5px;color:rgba(255,255,255,0.4)}

/* Module shell */
.module-view{display:none;flex:1;min-width:0}
.module-view.active{display:flex}
.submenu{
  width:196px;flex-shrink:0;padding:28px 12px;
  border-right:1px solid var(--th-border);background:rgba(255,255,255,0.4);
}
.submenu-title{
  font-size:10px;color:var(--th-text-3);font-weight:700;padding:0 10px;
  margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em;
}
.sub-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font-size:13px;color:var(--th-text-2);cursor:pointer;margin-bottom:2px;font-weight:500;
  transition:background .12s ease,color .12s ease;
}
.sub-item:hover{background:var(--th-bg-alt)}
.sub-item.active{background:var(--th-orange-bg);color:var(--th-orange);font-weight:700}
.sub-item i{font-size:15px}
.soon-dot{width:5px;height:5px;border-radius:50%;background:#D8D5E0;margin-left:auto}

main{flex:1;min-width:0;width:100%;padding:32px 44px 60px;overflow-y:auto}
main > *{max-width:1900px}
@media (max-width:1100px){main{padding:24px 20px 48px}}
h1{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em}
.subtitle{color:var(--th-text-2);font-size:13.5px;margin-bottom:4px;font-weight:500}
.tone{color:var(--th-text-3);font-size:13px;margin-bottom:26px}
.panel{display:none}.panel.active{display:block}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.topbar-search{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--th-card);
  border:1px solid var(--th-border);border-radius:11px;padding:9px 13px;
  color:var(--th-text-3);font-size:13px;box-shadow:var(--th-shadow-sm);
}
.topbar-search i{font-size:15px}
.topbar-kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--th-border);border-radius:5px;padding:1px 6px;color:var(--th-text-3)}
.topbar-icon-btn{
  width:38px;height:38px;border-radius:11px;background:var(--th-card);border:1px solid var(--th-border);
  display:flex;align-items:center;justify-content:center;color:var(--th-text-2);flex-shrink:0;box-shadow:var(--th-shadow-sm);
}
.topbar-icon-btn i{font-size:16px}
.topbar-badge{
  position:absolute;top:-4px;right:-4px;background:var(--th-red);color:#fff;
  font-size:9.5px;font-weight:700;width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--th-bg);
}
.topbar-profile{
  display:flex;align-items:center;gap:9px;background:var(--th-card);border:1px solid var(--th-border);
  border-radius:11px;padding:6px 12px 6px 6px;box-shadow:var(--th-shadow-sm);cursor:pointer;flex-shrink:0;
}
.topbar-avatar{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#FDBA74,var(--th-orange));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
}
.topbar-profile-text .name{font-size:12.5px;font-weight:700;line-height:1.2}
.topbar-profile-text .role{font-size:10.5px;color:var(--th-text-3);line-height:1.2}

.placeholder{
  background:var(--th-card);border-radius:20px;padding:52px 32px;text-align:center;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.placeholder-icon-wrap{
  width:52px;height:52px;border-radius:14px;margin:0 auto 14px;
  background:var(--th-orange-bg);display:flex;align-items:center;justify-content:center;
}
.placeholder i{font-size:24px;color:var(--th-orange);display:block}
.placeholder-badge{
  display:inline-block;font-size:11px;font-weight:700;color:var(--th-orange);
  background:var(--th-orange-bg);border-radius:20px;padding:4px 12px;margin-bottom:12px;
}
.placeholder p{font-size:13.5px;color:var(--th-text-2);max-width:400px;margin:0 auto;line-height:1.65}

.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat-card{
  background:var(--th-card);border-radius:18px;padding:19px;box-shadow:var(--th-shadow);
  border:1px solid var(--th-border);position:relative;overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--th-shadow-lg)}
.stat-card-icon{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--th-orange-bg);color:var(--th-orange);margin-bottom:12px;font-size:15px;
}
.stat-card.green .stat-card-icon{background:var(--th-green-bg);color:var(--th-green)}
.stat-card.red .stat-card-icon{background:var(--th-red-bg);color:var(--th-red)}
.stat-card.blue .stat-card-icon{background:var(--th-blue-bg);color:var(--th-blue)}
.stat-card.purple .stat-card-icon{background:var(--th-purple-bg);color:var(--th-purple)}
.stat-card .val{font-size:24px;font-weight:800;letter-spacing:-0.02em}
.stat-card .label{font-size:12px;color:var(--th-text-2);margin-top:3px;font-weight:500}
.stat-card.green .val{color:var(--th-green)}.stat-card.red .val{color:var(--th-red)}

.capture{
  background:var(--th-card);border-radius:18px;padding:16px;margin-bottom:18px;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.capture-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.capture input[type="text"]{flex:1;min-width:140px;border:none;outline:none;font-size:14px;background:transparent;color:var(--th-text);font-family:inherit}
.capture input[type="text"].fixed{flex:none;width:170px;border:1px solid var(--th-border);border-radius:9px;padding:8px 11px}
.capture input[type="number"]{width:100px;border:1px solid var(--th-border);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit}
.capture select{border:1px solid var(--th-border);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--th-text-2);background:var(--th-card);font-family:inherit}
.capture textarea{width:100%;border:none;outline:none;font-size:13px;background:transparent;color:var(--th-text);min-height:60px;resize:vertical;font-family:inherit;margin-top:6px}
.capture-title{width:100%;border:none;outline:none;font-size:14.5px;background:transparent;color:var(--th-text);font-weight:600;font-family:inherit}
.capture-footer{display:flex;justify-content:flex-end;margin-top:8px}
.add-btn{
  background:linear-gradient(135deg, var(--th-orange) 0%, #EA6A0C 100%);color:#fff;border:none;
  border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 14px -4px rgba(249,115,22,0.55);transition:transform .12s ease,box-shadow .12s ease;
  font-family:inherit;
}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(249,115,22,0.6)}
.import-btn{
  background:var(--th-card);color:var(--th-orange);border:1px solid var(--th-orange);border-radius:10px;
  padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;
  align-items:center;gap:6px;transition:background .12s ease;font-family:inherit;
}
.import-btn:hover{background:var(--th-orange-bg)}
.import-btn i{font-size:15px}

.section-label{font-size:11.5px;color:var(--th-text-3);font-weight:700;margin:0 0 11px;text-transform:uppercase;letter-spacing:.06em}
.row-list{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.row-card{
  background:var(--th-card);border-radius:15px;padding:15px 17px;box-shadow:var(--th-shadow-sm);
  border:1px solid var(--th-border);display:flex;align-items:center;gap:14px;
  transition:box-shadow .12s ease, border-color .12s ease;
}
.row-card:hover{box-shadow:var(--th-shadow);border-color:#DFDCE8}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;margin-bottom:4px;font-weight:600}
.row-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--th-text-2)}
.badge{font-size:11px;color:var(--th-text-2);background:var(--th-bg-alt);border-radius:7px;padding:3px 9px;font-weight:600}
.badge.origin{color:var(--th-orange);background:var(--th-orange-bg);display:flex;align-items:center;gap:4px}
.badge.origin i{font-size:12px}
.badge.critique{color:var(--th-red);background:var(--th-red-bg)}
select.status-select{border:1px solid var(--th-border);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--th-text-2);font-weight:600;background:var(--th-card);font-family:inherit}
.stat-input{width:56px;border:1px solid var(--th-border);border-radius:7px;padding:4px 6px;font-size:12px;text-align:center;font-family:inherit}
.vote-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.vote-btn{width:27px;height:27px;border-radius:8px;border:1px solid var(--th-border);background:var(--th-card);color:var(--th-orange);cursor:pointer;font-weight:700;transition:background .12s ease}
.vote-btn:hover{background:var(--th-orange-bg)}
.vote-count{font-size:14px;font-weight:700;width:20px;text-align:center}
.delete-btn{background:none;border:none;cursor:pointer;color:var(--th-text-3);padding:4px;flex-shrink:0;opacity:0;transition:opacity .12s ease,color .12s ease}
.row-card:hover .delete-btn{opacity:1}
.delete-btn:hover{color:var(--th-red)}
.search-bar{
  display:flex;align-items:center;gap:8px;background:var(--th-card);border:1px solid var(--th-border);
  border-radius:11px;padding:9px 13px;margin-bottom:14px;box-shadow:var(--th-shadow-sm);color:var(--th-text-3);
}
.search-bar i{font-size:15px}
.search-bar input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent;color:var(--th-text);font-family:inherit}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-chip{
  border:1px solid var(--th-border);background:var(--th-card);color:var(--th-text-2);border-radius:9px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s ease;font-family:inherit;
}
.filter-chip.active{background:var(--th-orange-bg);color:var(--th-orange);border-color:var(--th-orange)}
.data-table{
  width:100%;border-collapse:collapse;background:var(--th-card);border-radius:16px;overflow:hidden;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.data-table thead th{
  text-align:left;font-size:10.5px;font-weight:700;color:var(--th-text-3);text-transform:uppercase;
  letter-spacing:.05em;padding:12px 16px;background:var(--th-bg-alt);border-bottom:1px solid var(--th-border);
}
.data-table tbody td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--th-border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr{transition:background .1s ease}
.data-table tbody tr:hover{background:var(--th-bg-alt)}
.data-table tbody tr.done{opacity:.5}
.dt-title{font-weight:600}
.dt-actions{text-align:right;white-space:nowrap}
.delete-btn i{font-size:16px}
.empty{
  text-align:center;padding:44px 20px;color:var(--th-text-2);font-size:13.5px;
  background:var(--th-card);border-radius:18px;box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.empty i{font-size:24px;color:var(--th-orange);display:block;margin-bottom:10px}
.card{
  background:var(--th-card);border-radius:20px;padding:26px;margin-bottom:20px;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.card-header{display:flex;align-items:center;gap:9px;margin-bottom:17px}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.card-title .icon{color:var(--th-orange)}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}
.plan-channel-card{background:var(--th-card);border-radius:16px;padding:18px;box-shadow:var(--th-shadow);border:2px solid var(--th-border);cursor:pointer;transition:all .12s ease}
.plan-channel-card:hover{transform:translateY(-2px);box-shadow:var(--th-shadow-lg)}
.plan-channel-card.selected{border-color:var(--th-orange);background:var(--th-orange-bg)}
.plan-channel-icon{width:34px;height:34px;border-radius:10px;background:var(--th-orange-bg);color:var(--th-orange);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.plan-channel-card.selected .plan-channel-icon{background:#fff}
.sub-group-title{font-size:9.5px;color:var(--th-text-3);font-weight:800;padding:0 10px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.09em}
.sub-group-title:first-of-type{margin-top:4px}

/* Cartes canal riches */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:18px}
.ch-card{background:var(--th-card);border-radius:18px;padding:20px;box-shadow:var(--th-shadow);border:1px solid var(--th-border);cursor:pointer;transition:all .14s ease}
.ch-card:hover{transform:translateY(-3px);box-shadow:var(--th-shadow-lg);border-color:#DFDCE8}
.ch-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.ch-logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.ch-name{font-size:15.5px;font-weight:800;letter-spacing:-0.01em}
.ch-sub{font-size:11.5px;color:var(--th-text-2);font-weight:600;margin-top:1px}
.ch-status{margin-left:auto;flex-shrink:0}
.ch-body{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ch-metric .v{font-size:19px;font-weight:800;letter-spacing:-0.02em}
.ch-metric .l{font-size:10.5px;color:var(--th-text-3);font-weight:600;margin-top:1px}
.ch-spark{flex-shrink:0}
.hint-bar{display:flex;align-items:center;gap:10px;background:var(--th-card);border:1px solid var(--th-border);border-radius:14px;padding:14px 18px;font-size:12.5px;color:var(--th-text-2);box-shadow:var(--th-shadow-sm)}
.hint-bar .icon{color:var(--th-orange)}

/* Onglets de fiche */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--th-border);margin-bottom:22px}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--th-text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--th-text)}
.tab.active{color:var(--th-orange);border-bottom-color:var(--th-orange);font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}

/* Checklist de statut */
.check-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;font-weight:500}
.check-dot{width:16px;height:16px;border-radius:5px;border:1.6px solid var(--th-border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check-row.done .check-dot{background:var(--th-green);border-color:var(--th-green);color:#fff}
.check-row.current .check-dot{border-color:var(--th-orange);background:var(--th-orange-bg)}
.check-row.done{color:var(--th-text)}
.check-row.todo{color:var(--th-text-3)}

/* Calendrier avec filtres */
.cal-layout{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:start}
.cal-side{background:var(--th-card);border-radius:16px;padding:18px;box-shadow:var(--th-shadow);border:1px solid var(--th-border)}
.cal-side-title{font-size:12.5px;font-weight:800;margin-bottom:12px}
.cal-filter{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;font-weight:500;cursor:pointer}
.cal-swatch{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--th-border);background:var(--th-card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--th-text-2)}
.cal-event{border-radius:7px;padding:3px 6px;font-size:9.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{margin-bottom:4px}
.page-head .subtitle{margin-bottom:0}
.alert{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:13px;margin-bottom:10px}
.alert:last-child{margin-bottom:0}
.alert.warn{background:var(--th-red-bg)}
.alert.opp{background:var(--th-green-bg)}
.alert-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.alert.warn .alert-icon{color:var(--th-red)}
.alert.opp .alert-icon{color:var(--th-green)}
.alert-text{font-size:12.5px;line-height:1.5;font-weight:500}
.card-header i{font-size:17px;color:var(--th-orange)}
.card-header span{font-weight:700;font-size:15px}
.task-line{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;font-weight:500}
.task-line input[type="checkbox"]{width:17px;height:17px;accent-color:var(--th-orange)}
.idea-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:11px 0;border-bottom:1px solid var(--th-border);font-weight:500}
.idea-row:last-child{border-bottom:none}
.idea-date{color:var(--th-text-3);font-size:11px;font-weight:600}
.empty-hint{font-size:13px;color:var(--th-text-2);line-height:1.6}
.impact-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--th-text-2);font-size:12px;border:1px solid var(--th-border);border-radius:9px;padding:6px 11px;background:var(--th-card);font-weight:600;transition:all .12s ease}
.impact-toggle.active{color:var(--th-orange);border-color:var(--th-orange);background:var(--th-orange-bg)}
.impact-toggle i{font-size:14px}
.explore-btn{background:var(--th-card);border:1px solid var(--th-border);border-radius:9px;cursor:pointer;color:var(--th-text-2);padding:6px 11px;font-size:11px;font-weight:700;flex-shrink:0;transition:all .12s ease}
.explore-btn.active{color:var(--th-orange);border-color:var(--th-orange);background:var(--th-orange-bg)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kanban-col{background:var(--th-card);border-radius:16px;padding:14px;box-shadow:var(--th-shadow-sm);border:1px solid var(--th-border);min-height:100px}
.kanban-col-title{font-size:11px;color:var(--th-text-3);font-weight:700;margin-bottom:11px;text-transform:uppercase;letter-spacing:.04em}
.kanban-card{background:var(--th-bg-alt);border-radius:11px;padding:11px;font-size:12.5px;margin-bottom:7px;font-weight:600;box-shadow:0 1px 2px rgba(26,21,35,0.04)}
.kanban-card .kv{font-size:11px;color:var(--th-text-2);margin-top:3px;font-weight:500}
.kanban-empty{font-size:11px;color:var(--th-text-3);text-align:center;padding:14px 0}
.note-card{background:var(--th-card);border-radius:16px;padding:17px;box-shadow:var(--th-shadow-sm);border:1px solid var(--th-border);margin-bottom:9px}
.note-title{font-size:14px;font-weight:700;margin-bottom:5px}
.note-body{font-size:13px;color:var(--th-text-2);line-height:1.65;margin-bottom:9px;white-space:pre-wrap}
.note-footer{display:flex;justify-content:space-between;align-items:center}
.note-date{font-size:11px;color:var(--th-text-3);font-weight:600}
.task-flat-list{display:flex;flex-direction:column;gap:1px;background:var(--th-card);border-radius:18px;box-shadow:var(--th-shadow);border:1px solid var(--th-border);overflow:hidden}
.task-flat{display:flex;align-items:center;gap:10px;font-size:14px;padding:13px 17px;border-bottom:1px solid var(--th-border);font-weight:500}
.task-flat:last-child{border-bottom:none}
.task-flat.done{opacity:0.5}.task-flat.done span{text-decoration:line-through}
.task-flat input[type="checkbox"]{width:17px;height:17px;accent-color:var(--th-orange)}
.task-flat span{flex:1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,16,26,0.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:10}
.modal-overlay.open{display:flex}
.modal{background:var(--th-card);border-radius:20px;padding:22px;width:100%;max-width:420px;box-shadow:var(--th-shadow-lg);border:1px solid var(--th-border)}
.modal h3{font-size:15.5px;font-weight:700;margin-bottom:13px}
.modal-item{padding:11px 13px;border-radius:11px;font-size:13px;cursor:pointer;border:1px solid var(--th-border);margin-bottom:8px;font-weight:500;transition:all .12s ease}
.modal-item:hover{border-color:var(--th-orange);background:var(--th-orange-bg)}
.modal-close{margin-top:10px;font-size:12px;color:var(--th-text-2);background:none;border:none;cursor:pointer;font-weight:600}
.modal-empty{font-size:13px;color:var(--th-text-2);text-align:center;padding:16px 0}
</style></head>

/* ---------- Construction du DOM ---------- */
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  let lastGroup = null;
  MODULES.forEach((m, idx) => {
    if(m.group && m.group !== lastGroup){
      const title = document.createElement('div');
      title.className = 'nav-group-title';
      title.textContent = m.group.replace(/^\S+\s/, '');
      sb.appendChild(title);
      lastGroup = m.group;
    }
    const el = document.createElement('div');
    el.className = 'nav-item' + (idx===0 ? ' active' : '');
    el.dataset.module = m.id;
    el.innerHTML = `${ic(m.icon,16)}${m.label}`;
    el.addEventListener('click', () => selectModule(m.id));
    sb.appendChild(el);
  });

  const foot = document.createElement('div');
  foot.className = 'sidebar-foot';
  foot.innerHTML = `
    <div class="sidebar-avatar">S</div>
    <div class="sidebar-user">
      <div class="name">Sophie</div>
      <div class="role">Fondatrice</div>
    </div>
  `;
  sb.appendChild(foot);
}

function buildApp(){
  const app = document.getElementById('app');
  MODULES.forEach((m, mIdx) => {
    const view = document.createElement('div');
    view.className = 'module-view' + (mIdx===0 ? ' active' : '');
    view.id = 'view-' + m.id;

    const submenu = document.createElement('nav');
    submenu.className = 'submenu';
    submenu.innerHTML = `<div class="submenu-title">${m.label}</div>`;
    let lastSubGroup = null;
    m.sections.forEach((s, sIdx) => {
      if(s.group && s.group !== lastSubGroup){
        const gt = document.createElement('div');
        gt.className = 'sub-group-title';
        gt.textContent = s.group;
        submenu.appendChild(gt);
        lastSubGroup = s.group;
      }
      const item = document.createElement('div');
      item.className = 'sub-item' + (sIdx===0 ? ' active' : '');
      item.dataset.section = s.id;
      item.innerHTML = `${ic(s.icon,15)}${s.label}` + (!s.kind ? '<span class="soon-dot"></span>' : '');
      item.addEventListener('click', () => selectSection(m.id, s.id));
      submenu.appendChild(item);
    });

    const mainEl = document.createElement('main');
    const topbar = document.createElement('div');
    topbar.className = 'topbar';
    topbar.innerHTML = `
      <div class="topbar-search">${ic('ti-search')}Rechercher dans TigerHub...<span class="topbar-kbd">⌘K</span></div>
      <div class="topbar-icon-btn">${ic('ti-plus')}</div>
      <div class="topbar-icon-btn" style="position:relative">${ic('ti-bell')}<span class="topbar-badge">3</span></div>
      <div class="topbar-profile">
        <div class="topbar-avatar">S</div>
        <div class="topbar-profile-text"><div class="name">Sophie</div><div class="role">Owner</div></div>
        <span style="color:var(--th-text-3);display:inline-flex">${ic("chevron-down",14)}</span>
      </div>
    `;
    mainEl.appendChild(topbar);
    m.sections.forEach((s, sIdx) => {
      const panel = document.createElement('div');
      panel.className = 'panel' + (sIdx===0 ? ' active' : '');
      panel.id = `panel-${m.id}-${s.id}`;
      panel.innerHTML = s.kind ? panelTemplate(m.id, s) : placeholderTemplate(s);
      mainEl.appendChild(panel);
    });

    if(m.id === 'marketing'){
      const detailPanel = document.createElement('div');
      detailPanel.className = 'panel';
      detailPanel.id = 'panel-marketing-campaign-detail';
      detailPanel.innerHTML = `<div id="marketing-campaignDetailContent"></div>`;
      mainEl.appendChild(detailPanel);

      const chPanel = document.createElement('div');
      chPanel.className = 'panel';
      chPanel.id = 'panel-marketing-channel-detail';
      chPanel.innerHTML = `<div id="marketing-channelDetailContent"></div>`;
      mainEl.appendChild(chPanel);
    }

    view.appendChild(submenu);
    view.appendChild(mainEl);
    app.appendChild(view);
  });
}

/* ---------- Navigation ---------- */
function selectModule(moduleId){
  currentModule = moduleId;
  document.querySelectorAll('#sidebar .nav-item').forEach(el => el.classList.toggle('active', el.dataset.module === moduleId));
  document.querySelectorAll('.module-view').forEach(el => el.classList.toggle('active', el.id === 'view-' + moduleId));
}
function selectSection(moduleId, sectionId){
  const view = document.getElementById('view-' + moduleId);
  view.querySelectorAll('.sub-item').forEach(el => el.classList.toggle('active', el.dataset.section === sectionId));
  view.querySelectorAll('.panel').forEach(el => el.classList.toggle('active', el.id === `panel-${moduleId}-${sectionId}`));
}

let modalAction = null;
function openModal(title, itemsHtml, onEmpty){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = itemsHtml || `<p class="modal-empty">${onEmpty}</p>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalClose').addEventListener('click', closeModal);

/* ================= DASHBOARD ================= */
function renderDashboardHome(){
  const p = 'dashboard';
  const focusTitleEl = document.getElementById(`${p}-focusTitle`);
  if(!focusTitleEl) return;

  const statsGrid = document.getElementById(`${p}-statsGrid`);
  if(statsGrid){
    const activeTasksCount = tasks.filter(t=>!t.done).length;
    const unexploredIdeasCount = ideas.filter(i=>!i.explored).length;
    const activeCampaignsCount = campaigns.filter(c=>c.status==='Active' || c.status==='Planifiée').length;
    const openProspectsCount = prospects.filter(p=>p.stage!=='Gagné').length;
    statsGrid.innerHTML = `
      <div class="stat-card"><div class="stat-card-icon">${ic('ti-calendar-event',15)}</div><div class="val">${activeTasksCount}</div><div class="label">Tâches actives</div></div>
      <div class="stat-card blue"><div class="stat-card-icon">${ic('ti-bulb',15)}</div><div class="val">${unexploredIdeasCount}</div><div class="label">Idées à explorer</div></div>
      <div class="stat-card purple"><div class="stat-card-icon">${ic('ti-target-arrow',15)}</div><div class="val">${activeCampaignsCount}</div><div class="label">Campagnes en cours</div></div>
      <div class="stat-card green"><div class="stat-card-icon">${ic('ti-user-plus',15)}</div><div class="val">${openProspectsCount}</div><div class="label">Prospects en cours</div></div>`;
  }

  const activeTasks = tasks.filter(t => !t.done);
  const priorityTasks = activeTasks.filter(t => t.impact);
  const focusTasks = priorityTasks.length ? priorityTasks : activeTasks.slice(0,2);
  const toneEl = document.getElementById(`${p}-tone`);
  const focusContent = document.getElementById(`${p}-focusContent`);
  if(focusTasks.length === 0){
    focusTitleEl.textContent = `Focus du jour`;
    focusContent.innerHTML = `<p class="empty-hint">Rien de prioritaire pour l'instant. Ajoute une tâche dans le Planificateur quotidien pour la voir apparaître ici.</p>`;
    toneEl.textContent = `Une journée calme, pour l'instant.`;
  }else{
    const count = focusTasks.length;
    focusTitleEl.textContent = count === 1 ? `Une chose mérite ton énergie aujourd'hui` : `${count} choses méritent ton énergie aujourd'hui`;
    focusContent.innerHTML = focusTasks.map(t => `<div class="task-line"><input type="checkbox" disabled>${esc(t.title)}</div>`).join('');
    toneEl.textContent = count <= 2 ? `${count} sujet${count>1?'s':''} à traiter, rien qui déborde.` : `${count} sujets t'attendent aujourd'hui, mieux vaut commencer tôt.`;
  }
  const ideasContent = document.getElementById(`${p}-ideasContent`);
  ideasContent.innerHTML = ideas.length === 0
    ? `<p class="empty-hint">Aucune idée capturée pour l'instant.</p>`
    : ideas.slice(0,3).map(i => `<div class="idea-row"><span>${esc(i.text)}</span><span class="idea-date">${fmtDate(i.createdAt)}</span></div>`).join('');
  document.getElementById(`${p}-dateLabel`).textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}

let pendingImpact = false;

  const content = document.getElementById('planner-content');
  if(!content) return;
  if(tasks.length === 0){ content.innerHTML = `<div class="empty">${ic('ti-sparkles',24)}Aucune tâche pour l'instant. Ajoute la première chose à faire aujourd'hui.</div>`; return; }
  const active = tasks.filter(t=>!t.done), done = tasks.filter(t=>t.done);
  const priority = active.filter(t=>t.impact), normal = active.filter(t=>!t.impact);
  const row = t => `<div class="row-card ${t.done?'':''}" style="${t.done?'opacity:.5':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTaskDone('${t.id}')" style="width:18px;height:18px;accent-color:var(--th-orange)">

/* ---------- Calculs dérivés (jamais de double saisie) ---------- */
function campTotals(c){
  const r = c.results || {};
  return Object.values(r).reduce((a,x)=>({
    impressions:a.impressions+(x.impressions||0), clicks:a.clicks+(x.clicks||0),
    leads:a.leads+(x.leads||0), conversions:a.conversions+(x.conversions||0), cost:a.cost+(x.cost||0)
  }), {impressions:0,clicks:0,leads:0,conversions:0,cost:0});
}
function campChannels(c){ return Object.keys(c.results||{}); }
function cpl(t){ return t.leads>0 ? Math.round(t.cost/t.leads) : null; }
function convRate(t){ return t.leads>0 ? Math.round(t.conversions/t.leads*100) : 0; }
function segName(id){ const s = AUDIENCES.find(a=>a.id===id); return s ? s.nom : '—'; }
function statusBadge(s){
  const k = STATUS_STYLE[s]||'gray';
  const style = k==='purple'?'color:var(--th-purple);background:var(--th-purple-bg)':k==='orange'?'color:var(--th-orange);background:var(--th-orange-bg)':'';
  return `<span class="badge ${k}" style="${style}">${esc(s)}</span>`;
}
function aggregateByChannel(){
  const agg = {};
  campaigns.forEach(c => {
    Object.entries(c.results||{}).forEach(([ch,r]) => {
      if(!agg[ch]) agg[ch] = { impressions:0,clicks:0,leads:0,conversions:0,cost:0,campaigns:0,time:0 };
      const a = agg[ch];
      a.impressions+=r.impressions||0; a.clicks+=r.clicks||0; a.leads+=r.leads||0;
      a.conversions+=r.conversions||0; a.cost+=r.cost||0; a.campaigns++;
      a.time += (c.timeReal||0) / Math.max(1, Object.keys(c.results||{}).length);
    });
  });
  return agg;
}
function aggregateBySegment(){
  const agg = {};
  campaigns.forEach(c => {
    const t = campTotals(c);
    if(!agg[c.segmentId]) agg[c.segmentId] = { leads:0,conversions:0,cost:0,time:0,campaigns:0 };
    const a = agg[c.segmentId];
    a.leads+=t.leads; a.conversions+=t.conversions; a.cost+=t.cost; a.time+=(c.timeReal||0); a.campaigns++;
  });
  return agg;
}

  openCampaignId = id; campTab = 0;
  document.querySelectorAll('#view-marketing .panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('panel-marketing-campaign-detail').classList.add('active');
  renderCampaignDetail();
}
function closeCampaignDetail(){
  openCampaignId = null;
  document.getElementById('panel-marketing-campaign-detail').classList.remove('active');
  document.querySelector('#view-marketing .sub-item[data-section="campaigns"]').click();
}
function switchCampTab(i){ campTab = i; renderCampaignDetail(); }
function updateCampResult(id, ch, field, val){
  const c = campaigns.find(x=>x.id===id); if(!c) return;
  if(!c.results) c.results = {};
  if(!c.results[ch]) c.results[ch] = {impressions:0,clicks:0,leads:0,conversions:0,cost:0};
  c.results[ch][field] = Number(val)||0;
  saveKey('marketing-os:actions', campaigns);
  renderCampaignDetail(); refreshMktgAll();
}
function updateCampField(id, field, val){
  const c = campaigns.find(x=>x.id===id); if(!c) return;
  c[field] = (field==='budget'||field==='timeEstimated'||field==='timeReal') ? Number(val)||0 : val;
  saveKey('marketing-os:actions', campaigns);
  renderCampaignDetail(); refreshMktgAll();
}
function addChannelToCampaign(id){
  const c = campaigns.find(x=>x.id===id); if(!c) return;
  const avail = MKTG_CHANNELS.filter(ch=>!campChannels(c).includes(ch));
  if(!avail.length) return;
  if(!c.results) c.results = {};
  c.results[avail[0]] = {impressions:0,clicks:0,leads:0,conversions:0,cost:0};
  saveKey('marketing-os:actions', campaigns);
  renderCampaignDetail(); refreshMktgAll();
}

let openChannelFamily = null;
function renderMktgChannels(){
  const el = document.getElementById('marketing-channelsContent'); if(!el) return;
  const agg = aggregateByChannel();
  const famAgg = {};
  Object.entries(agg).forEach(([ch,a])=>{
    const fam = (CHANNEL_STYLE[ch]||{}).family || 'Autres';
    if(!famAgg[fam]) famAgg[fam] = { leads:0,cost:0,conversions:0,time:0,channels:[] };
    famAgg[fam].leads+=a.leads; famAgg[fam].cost+=a.cost; famAgg[fam].conversions+=a.conversions; famAgg[fam].time+=a.time;
    famAgg[fam].channels.push(ch);
  });
  const all = CHANNEL_FAMILIES.concat(['Autres']).filter(f=>famAgg[f]);

  el.innerHTML = `
    <div class="ch-grid">
      ${all.map(fam=>{ const a = famAgg[fam]; const skeleton = (fam==='SEO'||fam==='Emailing');
        return `<div class="ch-card" onclick="openChannelFam('${fam.replace(/'/g,"\\'")}')">
        <div class="ch-head">
          <div class="ch-logo" style="background:var(--th-bg-alt);color:var(--th-orange)">${ic(fam==='SEO'?'ti-search':fam==='Emailing'?'ti-mail':fam==='SEA / Publicité'?'ti-ad-2':fam==='Événements'?'ti-calendar':fam==='Partenariats'?'ti-handshake':'ti-share',19)}</div>

        <div class="ch-body" style="border-top:1px solid var(--th-border);padding-top:13px">
          <div class="ch-metric"><div class="v">${a.cost} €</div><div class="l">dépensés</div></div>
          <div class="ch-metric"><div class="v">${a.leads}</div><div class="l">leads</div></div>
          <div class="ch-metric"><div class="v">${Math.round(a.time)} h</div><div class="l">temps</div></div>
        </div></div>`; }).join('')}
    </div>

function openChannelFam(fam){

      <div class="stat-card"><div class="val">${chans.length}</div><div class="label">Canaux actifs</div></div>
      <div class="stat-card blue"><div class="val">${tot.leads}</div><div class="label">Leads</div></div>
      <div class="stat-card green"><div class="val">${tot.conv}</div><div class="label">Conversions</div></div>
      <div class="stat-card red"><div class="val">${tot.cost} €</div><div class="label">Dépensé</div></div>
      <div class="stat-card purple"><div class="val">${Math.round(tot.time)} h</div><div class="label">Temps investi</div></div>
    </div>
    <p class="section-label">Détail par canal</p>
    <table class="data-table"><thead><tr><th>Canal</th><th>Campagnes</th><th>Impressions</th><th>Clics</th><th>Leads</th><th>Conversions</th><th>Coût</th><th>Coût/lead</th></tr></thead><tbody>
      ${chans.map(ch=>{ const a=agg[ch]; const st=CHANNEL_STYLE[ch]||{};

      ${relCamps.map(c=>{ const t=campTotals(c); return `<tr onclick="openCampaignDetail('${c.id}')" style="cursor:pointer"><td class="dt-title">${esc(c.title)}</td><td><span class="badge">${esc(segName(c.segmentId))}</span></td><td>${statusBadge(c.status)}</td><td>${t.leads}</td><td>${t.cost} €</td></tr>`; }).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--th-text-2);padding:22px">Aucune campagne sur ce canal.</td></tr>`}
    </tbody></table>
    ${skeleton ? `<p class="section-label" style="margin-top:24px">Sections à venir</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">

let contentTab = 0;
let contentStatusFilter = 'Tous';
let contentSearch = '';
let calOffset = 0;
function switchContentTab(i){ contentTab = i; renderMktgContents(); }
function setContentStatus(v){ contentStatusFilter = v; renderMktgContents(); }
function setContentSearch(v){ contentSearch = v.toLowerCase(); renderMktgContents(); }
function shiftCal(d){ calOffset += d; renderMktgContents(); }
function renderMktgContents(){
  const el = document.getElementById('marketing-contentsContent'); if(!el) return;
  const tabs = ['Bibliothèque','Calendrier éditorial'];
  let body = '';

  if(contentTab===0){
    let list = contentStatusFilter==='Tous' ? CONTENTS : CONTENTS.filter(c=>c.statut===contentStatusFilter);
    if(contentSearch) list = list.filter(c=>c.titre.toLowerCase().includes(contentSearch));
    body = `
      <div class="filter-bar">
        ${['Tous',...CONTENT_STATUSES].map(s=>`<button class="filter-chip${contentStatusFilter===s?' active':''}" onclick="setContentStatus('${s}')">${s}</button>`).join('')}

      </div>
      <div class="search-bar">${ic('ti-search')}<input type="text" placeholder="Rechercher un contenu..." oninput="setContentSearch(this.value)"></div>
      <table class="data-table"><thead><tr><th>Contenu</th><th>Type</th><th>Canal</th><th>Segment</th><th>Campagne</th><th>Date</th><th>Statut</th></tr></thead><tbody>
        ${list.map(ct=>{ const camp = ct.campIdx!==null && campaigns[ct.campIdx] ? campaigns[ct.campIdx].title : null;
          const sc = ct.statut==='Publié'?'green':ct.statut==='À créer'?'gray':ct.statut==='Programmé'?'purple':ct.statut==='À préparer'?'orange':'blue';
          const scS = sc==='purple'?'color:var(--th-purple);background:var(--th-purple-bg)':sc==='orange'?'color:var(--th-orange);background:var(--th-orange-bg)':'';
          return `<tr><td class="dt-title">${esc(ct.titre)}</td><td><span class="badge">${esc(ct.type)}</span></td>
          <td>${esc(ct.canal)}</td><td style="font-size:12px;color:var(--th-text-2)">${esc(segName(ct.segmentId))}</td>
          <td style="font-size:12px;color:var(--th-text-2)">${camp?esc(camp):'—'}</td><td style="font-size:12px">${fmtDate(ct.date)}</td>
          <td><span class="badge ${sc}" style="${scS}">${esc(ct.statut)}</span></td></tr>`; }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--th-text-2);padding:22px">Aucun contenu pour ce filtre.</td></tr>`}
      </tbody></table>
      <div class="hint-bar" style="margin-top:16px">${ic('ti-bulb',16)}<span><b>Une seule bibliothèque.</b> « À créer » est simplement un statut, pas une liste séparée.</span></div>`;
  } else {
    const base = new Date();
    const shown = new Date(base.getFullYear(), base.getMonth()+calOffset, 1);
    const label = shown.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    const dim = new Date(shown.getFullYear(), shown.getMonth()+1, 0).getDate();
    let fd = shown.getDay(); fd = fd===0?6:fd-1;
    const monthKey = `${shown.getFullYear()}-${String(shown.getMonth()+1).padStart(2,'0')}`;
    let cells = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div style="font-size:10px;color:var(--th-text-3);font-weight:800;text-align:center;padding-bottom:6px;text-transform:uppercase">${d}</div>`).join('');
    for(let i=0;i<fd;i++) cells += '<div></div>';
    const today = calOffset===0 ? base.getDate() : -1;
    for(let d=1; d<=dim; d++){
      const dayKey = `${monthKey}-${String(d).padStart(2,'0')}`;
      const items = CONTENTS.filter(c=>c.date===dayKey);
      cells += `<div style="background:var(--th-card);border:1px solid ${d===today?'var(--th-orange)':'var(--th-border)'};border-radius:11px;min-height:84px;padding:7px">
        <div style="font-size:11px;color:${d===today?'var(--th-orange)':'var(--th-text-3)'};font-weight:800;margin-bottom:5px">${d}</div>
        ${items.map(c=>{ const sc = c.statut==='Publié'?['var(--th-green-bg)','var(--th-green)']:c.statut==='Programmé'?['var(--th-purple-bg)','var(--th-purple)']:c.statut==='À créer'?['var(--th-bg-alt)','var(--th-text-2)']:['var(--th-orange-bg)','var(--th-orange)'];
          return `<div style="background:${sc[0]};color:${sc[1]};border-radius:7px;padding:3px 6px;font-size:9.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(c.statut)} · ${esc(c.canal)}">${esc(c.titre)}</div>`; }).join('')}
      </div>`;
    }
    body = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">

        <button class="btn-ghost" onclick="calOffset=0;renderMktgContents()">Aujourd'hui</button>
        <button class="cal-nav-btn" onclick="shiftCal(1)" style="transform:rotate(180deg)">${ic('ti-arrow-left',15)}</button></div>
        <div style="font-size:15px;font-weight:800;text-transform:capitalize">${label}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${CONTENT_STATUSES.map(s=>{ const sc = s==='Publié'?'green':s==='Programmé'?'purple':s==='À créer'?'gray':'orange';
          const scS = sc==='purple'?'color:var(--th-purple);background:var(--th-purple-bg)':sc==='orange'?'color:var(--th-orange);background:var(--th-orange-bg)':'';
          return `<span class="badge ${sc}" style="${scS}">${s}</span>`; }).join('')}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${cells}</div>`;
  }
  el.innerHTML = `<div class="tabs">${tabs.map((t,i)=>`<div class="tab${i===contentTab?' active':''}" onclick="switchContentTab(${i})">${t}</div>`).join('')}</div>${body}`;
}

let analysisTab = 0;
function switchAnalysisTab(i){ analysisTab = i; renderMktgAnalysis(); }
function renderMktgAnalysis(){
  const el = document.getElementById('marketing-analysisContent'); if(!el) return;
  const tabs = ['Performance','Budget & temps'];
  const chAgg = aggregateByChannel();
  const segAgg = aggregateBySegment();
  const glob = campaigns.reduce((a,c)=>{ const t=campTotals(c); return {leads:a.leads+t.leads,conv:a.conv+t.conversions,cost:a.cost+t.cost,budget:a.budget+(c.budget||0),time:a.time+(c.timeReal||0),timeEst:a.timeEst+(c.timeEstimated||0)}; },{leads:0,conv:0,cost:0,budget:0,time:0,timeEst:0});

        <div class="stat-card ${glob.cost&&glob.conv?'green':'gray'}"><div class="val">${glob.conv?Math.round(glob.cost/glob.conv):0} €</div><div class="label">Coût d'acquisition</div></div>
      </div>
      <p class="section-label">Par canal</p>
      <table class="data-table"><thead><tr><th>Canal</th><th>Leads</th><th>Conversions</th><th>Taux</th><th>Coût</th><th>Coût/lead</th><th>Temps</th></tr></thead><tbody>
        ${Object.entries(chAgg).sort((a,b)=>b[1].leads-a[1].leads).map(([ch,a])=>{ const st=CHANNEL_STYLE[ch]||{};
          return `<tr><td><span class="badge" style="background:${st.tint||'var(--th-bg-alt)'};color:${st.c||'var(--th-text-2)'}">${esc(ch)}</span></td>
          <td>${a.leads}</td><td>${a.conversions}</td><td><span class="badge ${a.leads&&a.conversions/a.leads>0.08?'green':'gray'}">${a.leads?Math.round(a.conversions/a.leads*100):0}%</span></td>
          <td>${a.cost} €</td><td>${a.leads?Math.round(a.cost/a.leads)+' €':'—'}</td><td>${Math.round(a.time)} h</td></tr>`; }).join('')}
      </tbody></table>
      <p class="section-label" style="margin-top:24px">Par segment</p>
      <table class="data-table"><thead><tr><th>Segment</th><th>Campagnes</th><th>Leads</th><th>Conversions</th><th>Taux</th><th>Coût/lead</th><th>Temps</th></tr></thead><tbody>
        ${AUDIENCES.map(s=>{ const a=segAgg[s.id]||{leads:0,conversions:0,cost:0,time:0,campaigns:0};
          return `<tr><td class="dt-title">${esc(s.nom)}</td><td>${a.campaigns}</td><td>${a.leads}</td><td>${a.conversions}</td>
          <td><span class="badge ${a.leads&&a.conversions/a.leads>0.08?'green':'gray'}">${a.leads?Math.round(a.conversions/a.leads*100):0}%</span></td>
          <td>${a.leads?Math.round(a.cost/a.leads)+' €':'—'}</td><td>${a.time} h</td></tr>`; }).join('')}
      </tbody></table>
      <p class="section-label" style="margin-top:24px">Par campagne</p>
      <table class="data-table"><thead><tr><th>Campagne</th><th>Leads</th><th>Conversions</th><th>Coût</th><th>Coût/lead</th><th>ROI estimé</th></tr></thead><tbody>
        ${campaigns.map(c=>{ const t=campTotals(c); const roi = t.cost? Math.round((t.conversions*900 - t.cost)/t.cost*100) : 0;
          return `<tr onclick="openCampaignDetail('${c.id}')" style="cursor:pointer"><td class="dt-title">${esc(c.title)}</td><td>${t.leads}</td><td>${t.conversions}</td><td>${t.cost} €</td>
          <td>${cpl(t)?cpl(t)+' €':'—'}</td><td>${t.cost?`<span class="badge ${roi>=0?'green':'red'}">${roi>=0?'+':''}${roi}%</span>`:'—'}</td></tr>`; }).join('')}
      </tbody></table>`;

      </tbody></table>`;
  }
  el.innerHTML = `<div class="tabs">${tabs.map((t,i)=>`<div class="tab${i===analysisTab?' active':''}" onclick="switchAnalysisTab(${i})">${t}</div>`).join('')}</div>${body}`;
}

const SALES_STAGES = ['Nouveau','Qualifié','Proposition','Négociation','Gagné'];
function renderSalesStats(){
  const grid = document.getElementById('sales-statsGrid'); if(!grid) return;
  const total = prospects.length, won = prospects.filter(p=>p.stage==='Gagné').length;
  const conv = total ? Math.round((won/total)*100) : 0;
  const pipelineValue = prospects.filter(p=>p.stage!=='Gagné').reduce((s,p)=>s+(p.value||0),0);
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-card-icon">${ic('ti-user-plus')}</div><div class="val">${total}</div><div class="label">Prospects</div></div>
    <div class="stat-card green"><div class="stat-card-icon">${ic('ti-circle-check')}</div><div class="val">${won}</div><div class="label">Clients gagnés</div></div>
    <div class="stat-card blue"><div class="stat-card-icon">${ic('ti-percentage')}</div><div class="val">${conv}%</div><div class="label">Taux de conversion</div></div>
    <div class="stat-card purple"><div class="stat-card-icon">${ic('ti-coin')}</div><div class="val">${pipelineValue} €</div><div class="label">Valeur en pipeline</div></div>`;
}
let prospectFilter = 'Toutes';
let prospectSearch = '';
function setProspectFilter(v){ prospectFilter = v; renderProspects(); }
function setProspectSearch(v){ prospectSearch = v.toLowerCase(); renderProspects(); }

function renderProspects(){
  const c = document.getElementById('sales-content'); if(!c) return;
  if(prospects.length===0){ c.innerHTML = `<div class="empty">${ic('ti-user-plus',24)}Aucun prospect pour l'instant.</div>`; return; }

  const filterBar = `<div class="filter-bar">
    ${['Toutes', ...SALES_STAGES].map(s => `<button class="filter-chip${prospectFilter===s?' active':''}" onclick="setProspectFilter('${s}')">${esc(s)}</button>`).join('')}
  </div>`;

  let filtered = prospectFilter === 'Toutes' ? prospects : prospects.filter(p => p.stage === prospectFilter);
  if(prospectSearch) filtered = filtered.filter(p => p.name.toLowerCase().includes(prospectSearch));
  const sorted = [...filtered].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  if(sorted.length === 0){
    c.innerHTML = filterBar + `<div class="empty">${ic('ti-filter-off',24)}Aucun prospect ne correspond.</div>`;

  const rows = sorted.map(pr=>{

    return `<tr>
      <td><div class="dt-title">${esc(pr.name)}</div>${origin?`<span class="badge origin" style="margin-top:4px;display:inline-flex">${ic('ti-speakerphone',12)}Depuis ${esc(origin.title)}</span>`:''}</td>

      </td>
    </tr>`;

  c.innerHTML = filterBar + `<table class="data-table"><thead><tr><th>Prospect</th><th>Valeur</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;

function renderRevenue(){ const c=document.getElementById('finance-revenueContent'); if(!c) return; c.innerHTML = revenues.length===0?`<div class="empty">${ic('ti-trending-up',24)}Aucun revenu manuel.</div>`:`<div class="row-list">${revenues.map(r=>entryRow(r,'rev')).join('')}</div>`; }
function renderExpenses(){ const c=document.getElementById('finance-expenseContent'); if(!c) return; c.innerHTML = expenses.length===0?`<div class="empty">${ic('ti-trending-down',24)}Aucune dépense manuelle.</div>`:`<div class="row-list">${expenses.map(e=>entryRow(e,'exp')).join('')}</div>`; }
function addRevenue(label, amount){ revenues.unshift({id:'rev_'+Date.now(),label,amount,createdAt:new Date().toISOString()}); saveKey('finance:revenues',revenues); renderRevenue(); renderFinDashboard(); }
function addExpense(label, amount){ expenses.unshift({id:'exp_'+Date.now(),label,amount,createdAt:new Date().toISOString()}); saveKey('finance:expenses',expenses); renderExpenses(); renderFinDashboard(); }
function deleteFinEntry(kind, id){
  if(kind==='rev'){ revenues=revenues.filter(r=>r.id!==id); saveKey('finance:revenues',revenues); renderRevenue(); }
  else { expenses=expenses.filter(e=>e.id!==id); saveKey('finance:expenses',expenses); renderExpenses(); }
  renderFinDashboard();
}

/* ================= COMPETITOR WATCH ================= */
function renderCwStats(){
  const grid = document.getElementById('competitor-statsGrid'); if(!grid) return;
  grid.innerHTML = `<div class="stat-card"><div class="stat-card-icon">${ic('ti-building')}</div><div class="val">${competitors.length}</div><div class="label">Concurrents suivis</div></div>
    <div class="stat-card purple"><div class="stat-card-icon">${ic('ti-bulb')}</div><div class="val">0</div><div class="label">Opportunités identifiées</div></div>
    <div class="stat-card blue"><div class="stat-card-icon">${ic('ti-bell')}</div><div class="val">0</div><div class="label">Alertes récentes</div></div>`;
}
function renderCompetitors(){
  const c = document.getElementById('competitor-content'); if(!c) return;
  if(competitors.length===0){ c.innerHTML = `<div class="empty">${ic('ti-building',24)}Aucun concurrent suivi.</div>`; return; }
  const rows = competitors.map(cp=>`<tr>
    <td><div class="dt-title">${esc(cp.name)}</div></td>
    <td>${cp.notes?esc(cp.notes):'—'}</td>
    <td class="dt-actions"><button class="delete-btn" style="opacity:1" onclick="deleteCompetitor('${cp.id}')">${ic('ti-trash')}</button></td>
  </tr>`).join('');
  c.innerHTML = `<table class="data-table"><thead><tr><th>Concurrent</th><th>Notes</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function addCompetitor(name, notes){ competitors.unshift({id:'comp_'+Date.now(),name,notes,createdAt:new Date().toISOString()}); saveKey('competitor-watch:competitors',competitors); renderCompetitors(); renderCwStats(); }
function deleteCompetitor(id){ competitors=competitors.filter(c=>c.id!==id); saveKey('competitor-watch:competitors',competitors); renderCompetitors(); renderCwStats(); }

/* ================= SMART CONTACTS ================= */
function renderContacts(){
  const c = document.getElementById('contacts-content'); if(!c) return;
  if(contacts.length===0 && prospects.length===0){ c.innerHTML = `<div class="empty">${ic('ti-address-book',24)}Aucun contact pour l'instant.</div>`; return; }
  const salesRows = prospects.map(p => `<tr>
    <td><div class="dt-title">${esc(p.name)}</div></td>
    <td><span class="badge">Prospect</span></td>
    <td><span class="badge origin">${ic('ti-briefcase',12)}Développement commercial</span></td>
    <td></td>
  </tr>`).join('');
  const manualRows = contacts.map(ct => `<tr>
    <td><div class="dt-title">${esc(ct.name)}</div></td>
    <td><span class="badge">${esc(ct.type)}</span></td>
    <td>—</td>
    <td class="dt-actions"><button class="delete-btn" style="opacity:1" onclick="deleteContact('${ct.id}')">${ic('ti-trash')}</button></td>
  </tr>`).join('');
  c.innerHTML = `<table class="data-table"><thead><tr><th>Contact</th><th>Type</th><th>Origine</th><th></th></tr></thead><tbody>${salesRows}${manualRows}</tbody></table>`;
}
function addContact(name, type){ contacts.unshift({id:'contact_'+Date.now(),name,type,createdAt:new Date().toISOString()}); saveKey('smart-contacts:contacts',contacts); renderContacts(); }
function deleteContact(id){ contacts=contacts.filter(c=>c.id!==id); saveKey('smart-contacts:contacts',contacts); renderContacts(); }

/* ================= PARTNERS ================= */
function renderPartners(){
  const c = document.getElementById('partners-content'); if(!c) return;
  if(partners.length===0){ c.innerHTML = `<div class="empty">${ic('ti-handshake',24)}Aucun partenaire pour l'instant.</div>`; return; }
  const rows = partners.map(p=>`<tr>
    <td><div class="dt-title">${esc(p.name)}</div></td>
    <td>${p.notes?esc(p.notes):'—'}</td>
    <td class="dt-actions"><button class="delete-btn" style="opacity:1" onclick="deletePartner('${p.id}')">${ic('ti-trash')}</button></td>
  </tr>`).join('');
  c.innerHTML = `<table class="data-table"><thead><tr><th>Partenaire</th><th>Notes</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function addPartner(name, notes){ partners.unshift({id:'partner_'+Date.now(),name,notes,createdAt:new Date().toISOString()}); saveKey('partners:partners',partners); renderPartners(); }
function deletePartner(id){ partners=partners.filter(p=>p.id!==id); saveKey('partners:partners',partners); renderPartners(); }

/* ================= KNOWLEDGE CENTER ================= */
function renderNotes(){
  const c = document.getElementById('knowledge-content'); if(!c) return;
  c.innerHTML = notes.length===0 ? `<div class="empty">${ic('ti-note',24)}Aucune note pour l'instant.</div>` :
    notes.map(n=>`<div class="note-card"><div class="note-title">${esc(n.title)}</div>${n.body?`<div class="note-body">${esc(n.body)}</div>`:''}<div class="note-footer"><span class="note-date">${fmtDate(n.createdAt)}</span><button class="delete-btn" style="opacity:1" onclick="deleteNote('${n.id}')">${ic('ti-trash')}</button></div></div>`).join('');
}
function addNote(title, body){ notes.unshift({id:'note_'+Date.now(),title,body,createdAt:new Date().toISOString()}); saveKey('knowledge-center:notes',notes); renderNotes(); }
function deleteNote(id){ notes=notes.filter(n=>n.id!==id); saveKey('knowledge-center:notes',notes); renderNotes(); }

/* ================= DECISION JOURNAL ================= */
function renderDecisions(){
  const c = document.getElementById('decision-content'); if(!c) return;
  c.innerHTML = decisions.length===0 ? `<div class="empty">${ic('ti-notebook',24)}Aucune décision enregistrée.</div>` :
    decisions.map(d=>`<div class="note-card"><div class="note-title">${esc(d.title)}</div>${d.body?`<div class="note-body">${esc(d.body)}</div>`:''}<div class="note-footer"><span class="note-date">${fmtDate(d.createdAt)}</span><button class="delete-btn" style="opacity:1" onclick="deleteDecision('${d.id}')">${ic('ti-trash')}</button></div></div>`).join('');
}
function addDecision(title, body){ decisions.unshift({id:'dec_'+Date.now(),title,body,createdAt:new Date().toISOString()}); saveKey('decision-journal:decisions',decisions); renderDecisions(); }
function deleteDecision(id){ decisions=decisions.filter(d=>d.id!==id); saveKey('decision-journal:decisions',decisions); renderDecisions(); }

/* ================= LAUNCH MANAGER ================= */
function renderLaunch(){
  const c = document.getElementById('launch-content'); if(!c) return;
  c.innerHTML = launchItems.length===0 ? `<div class="empty">${ic('ti-rocket',24)}Aucune étape pour l'instant.</div>` :
    `<div class="task-flat-list">${launchItems.map(it=>`<div class="task-flat ${it.done?'done':''}"><input type="checkbox" ${it.done?'checked':''} onchange="toggleLaunchDone('${it.id}')"><span>${esc(it.title)}</span><button class="delete-btn" style="opacity:1" onclick="deleteLaunchItem('${it.id}')">${ic('ti-trash')}</button></div>`).join('')}</div>`;
}
function addLaunchItem(title){ launchItems.push({id:'launch_'+Date.now(),title,done:false}); saveKey('launch-manager:checklist',launchItems); renderLaunch(); }
function toggleLaunchDone(id){ const it=launchItems.find(i=>i.id===id); if(it) it.done=!it.done; saveKey('launch-manager:checklist',launchItems); renderLaunch(); }
function deleteLaunchItem(id){ launchItems=launchItems.filter(i=>i.id!==id); saveKey('launch-manager:checklist',launchItems); renderLaunch(); }

/* ---------- Liaison des événements (une seule fois) ---------- */
function bindEvents(){
  document.getElementById('planner-addBtn').addEventListener('click', addTask);
  document.getElementById('planner-taskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });
  document.getElementById('planner-impactToggle').addEventListener('click', () => {
    pendingImpact = !pendingImpact;
    document.getElementById('planner-impactToggle').classList.toggle('active', pendingImpact);
  });
  document.getElementById('planner-subtitle').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

  document.getElementById('ideabox-addBtn').addEventListener('click', addIdea);
  document.getElementById('ideabox-ideaInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addIdea(); });


  document.getElementById('sales-addBtn').addEventListener('click', () => {
    const input = document.getElementById('sales-prospectInput'); const name = input.value.trim(); if(!name) return;
    const value = Number(document.getElementById('sales-valueInput').value) || 0;
    addProspect(name, value, null);
    input.value=''; document.getElementById('sales-valueInput').value=''; input.focus();
  });
  document.getElementById('sales-prospectInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('sales-addBtn').click(); });
  document.getElementById('sales-importBtn').addEventListener('click', () => {
    const html = campaigns.map(c=>`<div class="modal-item" onclick="importCampaignToProspect('${c.id}')">${esc(c.title)} <span style="color:var(--th-text-2)">— ${esc(c.channel)}</span></div>`).join('');
    openModal('Créer un prospect depuis une campagne', html, 'Aucune campagne dans Marketing.');
  });

  document.getElementById('feedback-addBtn').addEventListener('click', () => {
    const input = document.getElementById('feedback-reqInput'); const text = input.value.trim(); if(!text) return;
    const requester = document.getElementById('feedback-requesterInput').value.trim();
    addFeedback(text, requester);
    input.value=''; document.getElementById('feedback-requesterInput').value=''; input.focus();
  });
  document.getElementById('feedback-reqInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('feedback-addBtn').click(); });

  document.getElementById('pm-addBtn').addEventListener('click', () => {
    const input = document.getElementById('pm-featInput'); const title = input.value.trim(); if(!title) return;
    addFeature(title, null, 0); input.value=''; input.focus();
  });
  document.getElementById('pm-featInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('pm-addBtn').click(); });
  document.getElementById('pm-importBtn').addEventListener('click', () => {
    const html = [...feedbacks].sort((a,b)=>(b.votes||0)-(a.votes||0)).map(f=>`<div class="modal-item" onclick="importFeedbackToFeature('${f.id}')">${esc(f.text)} <span style="color:var(--th-text-2)">— ${f.votes||0} votes</span></div>`).join('');
    openModal('Valider une demande en fonctionnalité', html, 'Aucune demande dans Retours clients.');
  });

  document.getElementById('bugs-addBtn').addEventListener('click', () => {
    const input = document.getElementById('bugs-bugInput'); const title = input.value.trim(); if(!title) return;
    addBug(title, document.getElementById('bugs-severitySelect').value); input.value=''; input.focus();
  });
  document.getElementById('bugs-bugInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('bugs-addBtn').click(); });

  document.getElementById('finance-addRevBtn').addEventListener('click', () => {
    const label = document.getElementById('finance-revLabel').value.trim(); if(!label) return;
    addRevenue(label, Number(document.getElementById('finance-revAmount').value)||0);
    document.getElementById('finance-revLabel').value=''; document.getElementById('finance-revAmount').value='';
  });
  document.getElementById('finance-addExpBtn').addEventListener('click', () => {
    const label = document.getElementById('finance-expLabel').value.trim(); if(!label) return;
    addExpense(label, Number(document.getElementById('finance-expAmount').value)||0);
    document.getElementById('finance-expLabel').value=''; document.getElementById('finance-expAmount').value='';
  });

  document.getElementById('competitor-addBtn').addEventListener('click', () => {
    const name = document.getElementById('competitor-compName').value.trim(); if(!name) return;
    addCompetitor(name, document.getElementById('competitor-compNotes').value.trim());
    document.getElementById('competitor-compName').value=''; document.getElementById('competitor-compNotes').value='';
  });

  document.getElementById('contacts-addBtn').addEventListener('click', () => {
    const name = document.getElementById('contacts-contactName').value.trim(); if(!name) return;
    addContact(name, document.getElementById('contacts-contactType').value);
    document.getElementById('contacts-contactName').value='';
  });

  document.getElementById('partners-addBtn').addEventListener('click', () => {
    const name = document.getElementById('partners-itemName').value.trim(); if(!name) return;
    addPartner(name, document.getElementById('partners-itemNotes').value.trim());
    document.getElementById('partners-itemName').value=''; document.getElementById('partners-itemNotes').value='';
  });

  document.getElementById('knowledge-addBtn').addEventListener('click', () => {
    const title = document.getElementById('knowledge-noteTitle').value.trim(); if(!title) return;
    addNote(title, document.getElementById('knowledge-noteBody').value.trim());
    document.getElementById('knowledge-noteTitle').value=''; document.getElementById('knowledge-noteBody').value='';
  });

  document.getElementById('decision-addBtn').addEventListener('click', () => {
    const title = document.getElementById('decision-decTitle').value.trim(); if(!title) return;
    addDecision(title, document.getElementById('decision-decBody').value.trim());
    document.getElementById('decision-decTitle').value=''; document.getElementById('decision-decBody').value='';
  });

  document.getElementById('launch-addBtn').addEventListener('click', () => {
    const input = document.getElementById('launch-taskInput'); const title = input.value.trim(); if(!title) return;
    addLaunchItem(title); input.value=''; input.focus();
  });
  document.getElementById('launch-taskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('launch-addBtn').click(); });
}

/* ---------- Initialisation ---------- */
async function init(){
  buildSidebar();
  buildApp();
  [tasks, ideas, campaigns, prospects, feedbacks, features, bugs, competitors, contacts, partners, notes, decisions, launchItems, revenues, expenses] = await Promise.all([
    loadKey('daily-planner:tasks'), loadKey('idea-box:ideas'), loadKey('marketing-os:actions'), loadKey('sales-portal:prospects'),
    loadKey('customer-feedback:requests'), loadKey('product-management:backlog'), loadKey('support-bugs:bugs'), loadKey('competitor-watch:competitors'),
    loadKey('smart-contacts:contacts'), loadKey('partners:partners'), loadKey('knowledge-center:notes'), loadKey('decision-journal:decisions'),
    loadKey('launch-manager:checklist'), loadKey('finance:revenues'), loadKey('finance:expenses')
  ]);
  bindEvents();
  await seedDemoCampaignsIfEmpty();
  renderDashboardHome(); renderPlanner(); renderIdeaBox();
  refreshMktgAll();
  renderSalesStats(); renderProspects(); renderPipeline();
  renderFbStats(); renderFeedbacks();
  renderRoadmap(); renderBacklog();
  renderBugsStats(); renderBugsOpen(); renderBugsCritical();
  renderFinDashboard(); renderRevenue(); renderExpenses();
  renderCwStats(); renderCompetitors();
  renderContacts(); renderPartners(); renderNotes(); renderDecisions(); renderLaunch();
}
init();
</script>
</body></html>
