<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TigerHub</title>
<!-- Icônes intégrées directement dans le fichier, aucune dépendance externe -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --th-bg:#F6F5F8;
  --th-bg-alt:#EFEEF4;
  --th-sidebar:#1B1523;
  --th-sidebar-2:#241D2E;
  --th-card:#FFFFFF;
  --th-text:#1A1523;
  --th-text-2:#6E6A7A;
  --th-text-3:#9793A3;
  --th-border:#E9E7EF;
  --th-orange:#F97316;
  --th-orange-2:#FB8B3D;
  --th-orange-bg:#FFF1E7;
  --th-blue:#3B82F6;
  --th-blue-bg:#EAF1FE;
  --th-red:#EF4444;
  --th-red-bg:#FEECEC;
  --th-green:#16A34A;
  --th-green-bg:#EAFAF0;
  --th-purple:#8B5CF6;
  --th-purple-bg:#F3EEFE;
  --th-shadow:0 1px 2px rgba(26,21,35,0.04), 0 8px 24px -8px rgba(26,21,35,0.10);
  --th-shadow-sm:0 1px 2px rgba(26,21,35,0.05);
  --th-shadow-lg:0 20px 48px -16px rgba(26,21,35,0.22);
}
*{box-sizing:border-box;margin:0;padding:0}
.icon{display:inline-block;vertical-align:-3px;flex-shrink:0}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1100px 520px at 100% -10%, rgba(249,115,22,0.07), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(139,92,246,0.05), transparent 55%),
    var(--th-bg);
  color:var(--th-text);
  display:flex;
  min-height:100vh;
  letter-spacing:-0.01em;
}
::selection{background:var(--th-orange-bg);color:var(--th-orange)}

#app{flex:1;min-width:0;display:flex}

/* Sidebar */
#sidebar{
  width:216px;flex-shrink:0;
  background:linear-gradient(185deg, var(--th-sidebar-2) 0%, var(--th-sidebar) 100%);
  padding:22px 12px 16px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.logo{
  display:flex;align-items:center;gap:9px;
  font-weight:700;font-size:15.5px;padding:2px 10px;margin-bottom:22px;color:#fff;
}
.logo-mark{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg, var(--th-orange) 0%, #FDBA74 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px -2px rgba(249,115,22,0.55);
}
.logo-mark svg{width:14px;height:14px}
.logo span{color:var(--th-orange-2)}
.nav-group-title{
  display:flex;align-items:center;gap:7px;
  font-size:11px;color:rgba(255,255,255,0.5);font-weight:700;
  padding:0 10px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.06em;
}
.nav-group-title:first-of-type{margin-top:2px}
.nav-group-title::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--th-orange-2);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(249,115,22,0.18);
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:9px;
  font-size:13px;color:rgba(255,255,255,0.62);margin-bottom:1px;cursor:pointer;
  font-weight:500;transition:background .12s ease,color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.92)}
.nav-item.active{
  background:linear-gradient(135deg, var(--th-orange) 0%, #EA6A0C 100%);
  color:#fff;font-weight:600;
  box-shadow:0 6px 16px -4px rgba(249,115,22,0.6);
}
.nav-item i{font-size:16px;flex-shrink:0}
.sidebar-foot{
  margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;gap:9px;
}
.sidebar-avatar{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#FDBA74,var(--th-orange));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;
}
.sidebar-user{min-width:0}
.sidebar-user .name{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .role{font-size:10.5px;color:rgba(255,255,255,0.4)}

/* Module shell */
.module-view{display:none;flex:1;min-width:0}
.module-view.active{display:flex}
.submenu{
  width:196px;flex-shrink:0;padding:28px 12px;
  border-right:1px solid var(--th-border);background:rgba(255,255,255,0.4);
}
.submenu-title{
  font-size:10px;color:var(--th-text-3);font-weight:700;padding:0 10px;
  margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em;
}
.sub-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font-size:13px;color:var(--th-text-2);cursor:pointer;margin-bottom:2px;font-weight:500;
  transition:background .12s ease,color .12s ease;
}
.sub-item:hover{background:var(--th-bg-alt)}
.sub-item.active{background:var(--th-orange-bg);color:var(--th-orange);font-weight:700}
.sub-item i{font-size:15px}
.soon-dot{width:5px;height:5px;border-radius:50%;background:#D8D5E0;margin-left:auto}

main{flex:1;min-width:0;width:100%;padding:32px 44px 60px;overflow-y:auto}
main > *{max-width:1900px}
@media (max-width:1100px){main{padding:24px 20px 48px}}
h1{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em}
.subtitle{color:var(--th-text-2);font-size:13.5px;margin-bottom:4px;font-weight:500}
.tone{color:var(--th-text-3);font-size:13px;margin-bottom:26px}
.panel{display:none}.panel.active{display:block}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.topbar-search{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--th-card);
  border:1px solid var(--th-border);border-radius:11px;padding:9px 13px;
  color:var(--th-text-3);font-size:13px;box-shadow:var(--th-shadow-sm);
}
.topbar-search i{font-size:15px}
.topbar-kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--th-border);border-radius:5px;padding:1px 6px;color:var(--th-text-3)}
.topbar-icon-btn{
  width:38px;height:38px;border-radius:11px;background:var(--th-card);border:1px solid var(--th-border);
  display:flex;align-items:center;justify-content:center;color:var(--th-text-2);flex-shrink:0;box-shadow:var(--th-shadow-sm);
}
.topbar-icon-btn i{font-size:16px}
.topbar-badge{
  position:absolute;top:-4px;right:-4px;background:var(--th-red);color:#fff;
  font-size:9.5px;font-weight:700;width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--th-bg);
}
.topbar-profile{
  display:flex;align-items:center;gap:9px;background:var(--th-card);border:1px solid var(--th-border);
  border-radius:11px;padding:6px 12px 6px 6px;box-shadow:var(--th-shadow-sm);cursor:pointer;flex-shrink:0;
}
.topbar-avatar{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#FDBA74,var(--th-orange));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
}
.topbar-profile-text .name{font-size:12.5px;font-weight:700;line-height:1.2}
.topbar-profile-text .role{font-size:10.5px;color:var(--th-text-3);line-height:1.2}

.placeholder{
  background:var(--th-card);border-radius:20px;padding:52px 32px;text-align:center;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.placeholder-icon-wrap{
  width:52px;height:52px;border-radius:14px;margin:0 auto 14px;
  background:var(--th-orange-bg);display:flex;align-items:center;justify-content:center;
}
.placeholder i{font-size:24px;color:var(--th-orange);display:block}
.placeholder-badge{
  display:inline-block;font-size:11px;font-weight:700;color:var(--th-orange);
  background:var(--th-orange-bg);border-radius:20px;padding:4px 12px;margin-bottom:12px;
}
.placeholder p{font-size:13.5px;color:var(--th-text-2);max-width:400px;margin:0 auto;line-height:1.65}

.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat-card{
  background:var(--th-card);border-radius:18px;padding:19px;box-shadow:var(--th-shadow);
  border:1px solid var(--th-border);position:relative;overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--th-shadow-lg)}
.stat-card-icon{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--th-orange-bg);color:var(--th-orange);margin-bottom:12px;font-size:15px;
}
.stat-card.green .stat-card-icon{background:var(--th-green-bg);color:var(--th-green)}
.stat-card.red .stat-card-icon{background:var(--th-red-bg);color:var(--th-red)}
.stat-card.blue .stat-card-icon{background:var(--th-blue-bg);color:var(--th-blue)}
.stat-card.purple .stat-card-icon{background:var(--th-purple-bg);color:var(--th-purple)}
.stat-card .val{font-size:24px;font-weight:800;letter-spacing:-0.02em}
.stat-card .label{font-size:12px;color:var(--th-text-2);margin-top:3px;font-weight:500}
.stat-card.green .val{color:var(--th-green)}.stat-card.red .val{color:var(--th-red)}

.capture{
  background:var(--th-card);border-radius:18px;padding:16px;margin-bottom:18px;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.capture-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.capture input[type="text"]{flex:1;min-width:140px;border:none;outline:none;font-size:14px;background:transparent;color:var(--th-text);font-family:inherit}
.capture input[type="text"].fixed{flex:none;width:170px;border:1px solid var(--th-border);border-radius:9px;padding:8px 11px}
.capture input[type="number"]{width:100px;border:1px solid var(--th-border);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit}
.capture select{border:1px solid var(--th-border);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--th-text-2);background:var(--th-card);font-family:inherit}
.capture textarea{width:100%;border:none;outline:none;font-size:13px;background:transparent;color:var(--th-text);min-height:60px;resize:vertical;font-family:inherit;margin-top:6px}
.capture-title{width:100%;border:none;outline:none;font-size:14.5px;background:transparent;color:var(--th-text);font-weight:600;font-family:inherit}
.capture-footer{display:flex;justify-content:flex-end;margin-top:8px}
.add-btn{
  background:linear-gradient(135deg, var(--th-orange) 0%, #EA6A0C 100%);color:#fff;border:none;
  border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 14px -4px rgba(249,115,22,0.55);transition:transform .12s ease,box-shadow .12s ease;
  font-family:inherit;
}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(249,115,22,0.6)}
.import-btn{
  background:var(--th-card);color:var(--th-orange);border:1px solid var(--th-orange);border-radius:10px;
  padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;
  align-items:center;gap:6px;transition:background .12s ease;font-family:inherit;
}
.import-btn:hover{background:var(--th-orange-bg)}
.import-btn i{font-size:15px}

.section-label{font-size:11.5px;color:var(--th-text-3);font-weight:700;margin:0 0 11px;text-transform:uppercase;letter-spacing:.06em}
.row-list{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.row-card{
  background:var(--th-card);border-radius:15px;padding:15px 17px;box-shadow:var(--th-shadow-sm);
  border:1px solid var(--th-border);display:flex;align-items:center;gap:14px;
  transition:box-shadow .12s ease, border-color .12s ease;
}
.row-card:hover{box-shadow:var(--th-shadow);border-color:#DFDCE8}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;margin-bottom:4px;font-weight:600}
.row-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--th-text-2)}
.badge{font-size:11px;color:var(--th-text-2);background:var(--th-bg-alt);border-radius:7px;padding:3px 9px;font-weight:600}
.badge.origin{color:var(--th-orange);background:var(--th-orange-bg);display:flex;align-items:center;gap:4px}
.badge.origin i{font-size:12px}
.badge.critique{color:var(--th-red);background:var(--th-red-bg)}
select.status-select{border:1px solid var(--th-border);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--th-text-2);font-weight:600;background:var(--th-card);font-family:inherit}
.stat-input{width:56px;border:1px solid var(--th-border);border-radius:7px;padding:4px 6px;font-size:12px;text-align:center;font-family:inherit}
.vote-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.vote-btn{width:27px;height:27px;border-radius:8px;border:1px solid var(--th-border);background:var(--th-card);color:var(--th-orange);cursor:pointer;font-weight:700;transition:background .12s ease}
.vote-btn:hover{background:var(--th-orange-bg)}
.vote-count{font-size:14px;font-weight:700;width:20px;text-align:center}
.delete-btn{background:none;border:none;cursor:pointer;color:var(--th-text-3);padding:4px;flex-shrink:0;opacity:0;transition:opacity .12s ease,color .12s ease}
.row-card:hover .delete-btn{opacity:1}
.delete-btn:hover{color:var(--th-red)}
.search-bar{
  display:flex;align-items:center;gap:8px;background:var(--th-card);border:1px solid var(--th-border);
  border-radius:11px;padding:9px 13px;margin-bottom:14px;box-shadow:var(--th-shadow-sm);color:var(--th-text-3);
}
.search-bar i{font-size:15px}
.search-bar input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent;color:var(--th-text);font-family:inherit}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-chip{
  border:1px solid var(--th-border);background:var(--th-card);color:var(--th-text-2);border-radius:9px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s ease;font-family:inherit;
}
.filter-chip.active{background:var(--th-orange-bg);color:var(--th-orange);border-color:var(--th-orange)}
.data-table{
  width:100%;border-collapse:collapse;background:var(--th-card);border-radius:16px;overflow:hidden;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.data-table thead th{
  text-align:left;font-size:10.5px;font-weight:700;color:var(--th-text-3);text-transform:uppercase;
  letter-spacing:.05em;padding:12px 16px;background:var(--th-bg-alt);border-bottom:1px solid var(--th-border);
}
.data-table tbody td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--th-border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr{transition:background .1s ease}
.data-table tbody tr:hover{background:var(--th-bg-alt)}
.data-table tbody tr.done{opacity:.5}
.dt-title{font-weight:600}
.dt-actions{text-align:right;white-space:nowrap}
.delete-btn i{font-size:16px}
.empty{
  text-align:center;padding:44px 20px;color:var(--th-text-2);font-size:13.5px;
  background:var(--th-card);border-radius:18px;box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.empty i{font-size:24px;color:var(--th-orange);display:block;margin-bottom:10px}
.card{
  background:var(--th-card);border-radius:20px;padding:26px;margin-bottom:20px;
  box-shadow:var(--th-shadow);border:1px solid var(--th-border);
}
.card-header{display:flex;align-items:center;gap:9px;margin-bottom:17px}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.card-title .icon{color:var(--th-orange)}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}
.plan-channel-card{background:var(--th-card);border-radius:16px;padding:18px;box-shadow:var(--th-shadow);border:2px solid var(--th-border);cursor:pointer;transition:all .12s ease}
.plan-channel-card:hover{transform:translateY(-2px);box-shadow:var(--th-shadow-lg)}
.plan-channel-card.selected{border-color:var(--th-orange);background:var(--th-orange-bg)}
.plan-channel-icon{width:34px;height:34px;border-radius:10px;background:var(--th-orange-bg);color:var(--th-orange);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.plan-channel-card.selected .plan-channel-icon{background:#fff}
.sub-group-title{font-size:9.5px;color:var(--th-text-3);font-weight:800;padding:0 10px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.09em}
.sub-group-title:first-of-type{margin-top:4px}

/* Cartes canal riches */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:18px}
.ch-card{background:var(--th-card);border-radius:18px;padding:20px;box-shadow:var(--th-shadow);border:1px solid var(--th-border);cursor:pointer;transition:all .14s ease}
.ch-card:hover{transform:translateY(-3px);box-shadow:var(--th-shadow-lg);border-color:#DFDCE8}
.ch-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.ch-logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.ch-name{font-size:15.5px;font-weight:800;letter-spacing:-0.01em}
.ch-sub{font-size:11.5px;color:var(--th-text-2);font-weight:600;margin-top:1px}
.ch-status{margin-left:auto;flex-shrink:0}
.ch-body{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ch-metric .v{font-size:19px;font-weight:800;letter-spacing:-0.02em}
.ch-metric .l{font-size:10.5px;color:var(--th-text-3);font-weight:600;margin-top:1px}
.ch-spark{flex-shrink:0}
.param-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--th-border)}
.param-row:last-child{border-bottom:none}
.param-toggle{width:36px;height:20px;border-radius:11px;background:var(--th-border);flex-shrink:0;padding:2px;transition:background .15s}
.param-toggle.on{background:var(--th-green)}
.param-knob{width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.param-toggle.on .param-knob{transform:translateX(16px)}
.param-radio{display:flex;align-items:center;gap:11px;border:1.5px solid var(--th-border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .12s}
.param-radio:hover{border-color:var(--th-orange)}
.param-radio.sel{border-color:var(--th-orange);background:var(--th-orange-bg)}
.param-radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--th-border);flex-shrink:0}
.param-radio.sel .param-radio-dot{border-color:var(--th-orange);background:var(--th-orange);box-shadow:inset 0 0 0 3px #fff}
.param-textarea{width:100%;min-height:64px;border:1px solid var(--th-border);border-radius:11px;padding:11px 13px;font-size:12.5px;font-family:inherit;line-height:1.6;resize:vertical;outline:none;color:var(--th-text);background:var(--th-card)}
.param-textarea:focus{border-color:var(--th-orange)}
.formula-box{background:var(--th-orange-bg);color:var(--th-orange);border-radius:11px;padding:13px 16px;font-size:13px;font-weight:700;text-align:center}
.formula-item{background:var(--th-bg-alt);border-radius:11px;padding:13px}
.formula-code{font-family:monospace;font-size:11.5px;color:var(--th-text-2)}
.seuil-card{background:var(--th-bg-alt);border-radius:13px;padding:15px}
.oia{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.oia-step{flex:1;min-width:200px;background:var(--th-bg-alt);border-radius:13px;padding:15px}
.oia-step.oia-final{background:var(--th-orange-bg)}
.oia-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.oia-icon{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.oia-title{font-size:12.5px;font-weight:800}
.oia-sub{font-size:10.5px;color:var(--th-text-3);font-weight:600}

.utm-val{font-size:12.5px;font-family:monospace;background:var(--th-bg-alt);border-radius:8px;padding:9px 11px;word-break:break-all}
.today-bar{display:flex;align-items:center;gap:20px;background:var(--th-card);border:1px solid var(--th-border);border-radius:14px;padding:15px 20px;margin-bottom:16px;box-shadow:var(--th-shadow-sm);flex-wrap:wrap;font-size:13px}
.today-item{display:flex;align-items:center;gap:8px;color:var(--th-text-2)}
.today-item b{color:var(--th-text);font-size:15px;font-weight:800}
.today-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.todo-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--th-border);cursor:pointer}
.todo-row:last-of-type{border-bottom:none}
.todo-row:hover .todo-action{color:var(--th-orange)}
.todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.todo-action{font-size:12px;font-weight:700;color:var(--th-text-3);white-space:nowrap;align-self:center;transition:color .12s}
.launch-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--th-border);cursor:pointer}
.launch-row:last-of-type{border-bottom:none}
.launch-date{width:44px;text-align:center;flex-shrink:0;background:var(--th-bg-alt);border-radius:10px;padding:7px 0}
.timeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:8px 0}
.tl-step{flex:1;min-width:96px;text-align:center;position:relative;padding-top:20px}
.tl-step::before{content:'';position:absolute;top:5px;left:50%;right:-50%;height:2px;background:var(--th-border)}
.tl-step:last-child::before{display:none}
.tl-dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:var(--th-border);border:2px solid var(--th-card);z-index:1}
.tl-step.hl .tl-dot{background:var(--th-orange);width:14px;height:14px;top:-1px;box-shadow:0 0 0 3px var(--th-orange-bg)}
.tl-date{font-size:11px;color:var(--th-text-3);font-weight:700;margin-bottom:3px}
.tl-label{font-size:12px;font-weight:600}
.tl-step.hl .tl-label{color:var(--th-orange);font-weight:800}
.channel-pick{display:flex;align-items:center;gap:10px;background:var(--th-card);border:1px solid var(--th-border);border-radius:12px;padding:12px 14px}
.channel-pick.used{border-color:var(--th-green);background:var(--th-green-bg)}
.conn-card{display:flex;align-items:center;gap:11px;background:var(--th-card);border:1px solid var(--th-border);border-radius:14px;padding:14px 16px;box-shadow:var(--th-shadow-sm)}
.conn-icon{width:30px;height:30px;border-radius:10px;background:var(--th-orange-bg);color:var(--th-orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conn-label{font-size:10.5px;color:var(--th-text-3);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.conn-val{font-size:12.5px;font-weight:600;margin-top:2px}
.msg-card{background:var(--th-bg-alt);border-radius:13px;padding:15px 17px;margin-bottom:12px;border-left:3px solid var(--th-border)}
.msg-card.works{border-left-color:var(--th-green);background:var(--th-green-bg)}
.msg-card.fails{border-left-color:var(--th-red);background:var(--th-red-bg)}
.insight-card{display:flex;gap:13px;background:var(--th-card);border:1px solid var(--th-border);border-radius:14px;padding:15px 17px;margin-bottom:10px;box-shadow:var(--th-shadow-sm)}
.insight-icon{width:30px;height:30px;border-radius:10px;background:var(--th-orange-bg);color:var(--th-orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ctx-bar{display:flex;align-items:center;gap:22px;background:var(--th-card);border:1px solid var(--th-border);border-radius:14px;padding:15px 20px;margin-bottom:8px;box-shadow:var(--th-shadow-sm);flex-wrap:wrap}
.ctx-main{display:flex;align-items:center;gap:11px}
.ctx-sep{width:1px;height:30px;background:var(--th-border)}
.prio-row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--th-border);cursor:pointer}
.prio-row:last-of-type{border-bottom:none}
.prio-row:hover .prio-num{background:var(--th-orange);color:#fff}
.prio-num{width:24px;height:24px;border-radius:8px;background:var(--th-orange-bg);color:var(--th-orange);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;transition:all .12s}
.launch-step.blocking{border:1px solid var(--th-red-bg)}
.zone-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin:26px 0 12px;padding-left:11px;border-left:3px solid}
.zone-label:first-of-type{margin-top:0}
.zone-red{color:var(--th-red);border-color:var(--th-red)}
.zone-orange{color:var(--th-orange);border-color:var(--th-orange)}
.zone-green{color:var(--th-green);border-color:var(--th-green)}
.zone-blue{color:var(--th-blue);border-color:var(--th-blue)}
.launch-card{border-left:3px solid var(--th-orange)}
.launch-step{display:flex;align-items:center;gap:9px;background:var(--th-bg-alt);border-radius:11px;padding:11px 13px;cursor:pointer;transition:background .12s}
.launch-step:hover{background:var(--th-orange-bg)}
.launch-step.done{background:var(--th-green-bg)}
.launch-check{width:18px;height:18px;border-radius:6px;border:1.6px solid var(--th-border);background:var(--th-card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.launch-step.done .launch-check{background:var(--th-green);border-color:var(--th-green);color:#fff}
.week-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--th-border);font-size:13px;cursor:pointer;color:var(--th-text-2)}
.week-row:last-child{border-bottom:none}
.week-row:hover{color:var(--th-text)}
.week-row .icon{transform:rotate(180deg);color:var(--th-text-3)}
.week-num{font-size:19px;font-weight:800;color:var(--th-orange);min-width:26px}
.waiting-block{text-align:center;padding:26px 16px;background:var(--th-bg-alt);border-radius:13px;color:var(--th-text-2)}
.waiting-block .icon{color:var(--th-text-3);margin-bottom:9px}
.waiting-block p{font-size:12.5px;line-height:1.7;margin:0}
.stat-card{transition:transform .15s,box-shadow .15s}
.sector-bar{display:flex;align-items:center;gap:11px;background:var(--th-card);border:1px solid var(--th-border);border-left:3px solid var(--th-orange);border-radius:12px;padding:13px 17px;font-size:13px;margin-bottom:18px;box-shadow:var(--th-shadow-sm)}
.sector-dot{width:9px;height:9px;border-radius:50%;background:var(--th-green);box-shadow:0 0 0 3px var(--th-green-bg);flex-shrink:0}
.sector-chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--th-border);background:var(--th-card);color:var(--th-text-2)}
.sector-chip.active{background:var(--th-orange-bg);color:var(--th-orange);border-color:var(--th-orange)}
.sector-chip.soon{opacity:.55}
.hint-bar{display:flex;align-items:center;gap:10px;background:var(--th-card);border:1px solid var(--th-border);border-radius:14px;padding:14px 18px;font-size:12.5px;color:var(--th-text-2);box-shadow:var(--th-shadow-sm)}
.hint-bar .icon{color:var(--th-orange)}

/* Onglets de fiche */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--th-border);margin-bottom:22px}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--th-text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--th-text)}
.tab.active{color:var(--th-orange);border-bottom-color:var(--th-orange);font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}

/* Checklist de statut */
.check-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;font-weight:500}
.check-dot{width:16px;height:16px;border-radius:5px;border:1.6px solid var(--th-border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check-row.done .check-dot{background:var(--th-green);border-color:var(--th-green);color:#fff}
.check-row.current .check-dot{border-color:var(--th-orange);background:var(--th-orange-bg)}
.check-row.done{color:var(--th-text)}
.check-row.todo{color:var(--th-text-3)}

.cal-layout{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:start}
.cal-side{background:var(--th-card);border-radius:16px;padding:18px;box-shadow:var(--th-shadow);border:1px solid var(--th-border)}
.cal-side-title{font-size:12.5px;font-weight:800;margin-bottom:12px}
.cal-filter{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;font-weight:500;cursor:pointer}
.cal-swatch{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--th-border);background:var(--th-card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--th-text-2)}
.cal-event{border-radius:7px;padding:3px 6px;font-size:9.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{margin-bottom:4px}
.page-head .subtitle{margin-bottom:0}
.alert{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:13px;margin-bottom:10px}
.alert:last-child{margin-bottom:0}
.alert.warn{background:var(--th-red-bg)}
.alert.opp{background:var(--th-green-bg)}
.alert-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.alert.warn .alert-icon{color:var(--th-red)}
.alert.opp .alert-icon{color:var(--th-green)}
.alert-text{font-size:12.5px;line-height:1.5;font-weight:500}
.card-header i{font-size:17px;color:var(--th-orange)}
.card-header span{font-weight:700;font-size:15px}
.task-line{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;font-weight:500}
.task-line input[type="checkbox"]{width:17px;height:17px;accent-color:var(--th-orange)}
.idea-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:11px 0;border-bottom:1px solid var(--th-border);font-weight:500}
.idea-row:last-child{border-bottom:none}
.idea-date{color:var(--th-text-3);font-size:11px;font-weight:600}
.empty-hint{font-size:13px;color:var(--th-text-2);line-height:1.6}
.impact-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--th-text-2);font-size:12px;border:1px solid var(--th-border);border-radius:9px;padding:6px 11px;background:var(--th-card);font-weight:600;transition:all .12s ease}
.impact-toggle.active{color:var(--th-orange);border-color:var(--th-orange);background:var(--th-orange-bg)}

.explore-btn{background:var(--th-card);border:1px solid var(--th-border);border-radius:9px;cursor:pointer;color:var(--th-text-2);padding:6px 11px;font-size:11px;font-weight:700;flex-shrink:0;transition:all .12s ease}
.explore-btn.active{color:var(--th-orange);border-color:var(--th-orange);background:var(--th-orange-bg)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}

.kanban-card{background:var(--th-bg-alt);border-radius:11px;padding:11px;font-size:12.5px;margin-bottom:7px;font-weight:600;box-shadow:0 1px 2px rgba(26,21,35,0.04)}
.kanban-card .kv{font-size:11px;color:var(--th-text-2);margin-top:3px;font-weight:500}
.kanban-empty{font-size:11px;color:var(--th-text-3);text-align:center;padding:14px 0}
.note-card{background:var(--th-card);border-radius:16px;padding:17px;box-shadow:var(--th-shadow-sm);border:1px solid var(--th-border);margin-bottom:9px}
.note-title{font-size:14px;font-weight:700;margin-bottom:5px}
.note-body{font-size:13px;color:var(--th-text-2);line-height:1.65;margin-bottom:9px;white-space:pre-wrap}
.note-footer{display:flex;justify-content:space-between;align-items:center}
.note-date{font-size:11px;color:var(--th-text-3);font-weight:600}
.task-flat-list{display:flex;flex-direction:column;gap:1px;background:var(--th-card);border-radius:18px;box-shadow:var(--th-shadow);border:1px solid var(--th-border);overflow:hidden}
.task-flat{display:flex;align-items:center;gap:10px;font-size:14px;padding:13px 17px;border-bottom:1px solid var(--th-border);font-weight:500}
.task-flat:last-child{border-bottom:none}
.task-flat.done{opacity:0.5}.task-flat.done span{text-decoration:line-through}
.task-flat input[type="checkbox"]{width:17px;height:17px;accent-color:var(--th-orange)}
.task-flat span{flex:1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,16,26,0.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:10}
.modal-overlay.open{display:flex}
.modal{background:var(--th-card);border-radius:20px;padding:22px;width:100%;max-width:420px;box-shadow:var(--th-shadow-lg);border:1px solid var(--th-border)}

  const key = String(name||'').replace(/^ti-/,'');

}

let currentModule = 'dashboard';

/* ---------- Construction du DOM ---------- */
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  let lastGroup = null;
  MODULES.forEach((m, idx) => {
    if(m.group && m.group !== lastGroup){
      const title = document.createElement('div');
      title.className = 'nav-group-title';
      title.textContent = m.group.replace(/^\S+\s/, '');
      sb.appendChild(title);
      lastGroup = m.group;
    }
    const el = document.createElement('div');
    el.className = 'nav-item' + (idx===0 ? ' active' : '');
    el.dataset.module = m.id;
    el.innerHTML = `${ic(m.icon,16)}${m.label}`;
    el.addEventListener('click', () => selectModule(m.id));
    sb.appendChild(el);
  });

  const foot = document.createElement('div');
  foot.className = 'sidebar-foot';
  foot.innerHTML = `
    <div class="sidebar-avatar">S</div>
    <div class="sidebar-user">
      <div class="name">Sophie</div>
      <div class="role">Fondatrice</div>
    </div>
  `;
  sb.appendChild(foot);
}

function buildApp(){
  const app = document.getElementById('app');
  MODULES.forEach((m, mIdx) => {
    const view = document.createElement('div');
    view.className = 'module-view' + (mIdx===0 ? ' active' : '');
    view.id = 'view-' + m.id;

    const submenu = document.createElement('nav');
    submenu.className = 'submenu';
    submenu.innerHTML = `<div class="submenu-title">${m.label}</div>`;
    let lastSubGroup = null;
    m.sections.forEach((s, sIdx) => {
      if(s.group && s.group !== lastSubGroup){
        const gt = document.createElement('div');
        gt.className = 'sub-group-title';
        gt.textContent = s.group;
        submenu.appendChild(gt);
        lastSubGroup = s.group;
      }
      const item = document.createElement('div');
      item.className = 'sub-item' + (sIdx===0 ? ' active' : '');
      item.dataset.section = s.id;
      item.innerHTML = `${ic(s.icon,15)}${s.label}` + (!s.kind ? '<span class="soon-dot"></span>' : '');
      item.addEventListener('click', () => selectSection(m.id, s.id));
      submenu.appendChild(item);
    });

    const mainEl = document.createElement('main');
    const topbar = document.createElement('div');
    topbar.className = 'topbar';
    topbar.innerHTML = `
      <div class="topbar-search">${ic('ti-search')}Rechercher dans TigerHub...<span class="topbar-kbd">⌘K</span></div>
      <div class="topbar-icon-btn">${ic('ti-plus')}</div>
      <div class="topbar-icon-btn" style="position:relative">${ic('ti-bell')}<span class="topbar-badge">3</span></div>
      <div class="topbar-profile">
        <div class="topbar-avatar">S</div>
        <div class="topbar-profile-text"><div class="name">Sophie</div><div class="role">Owner</div></div>
        <span style="color:var(--th-text-3);display:inline-flex">${ic("chevron-down",14)}</span>
      </div>
    `;
    mainEl.appendChild(topbar);
    m.sections.forEach((s, sIdx) => {
      const panel = document.createElement('div');
      panel.className = 'panel' + (sIdx===0 ? ' active' : '');
      panel.id = `panel-${m.id}-${s.id}`;
      panel.innerHTML = s.kind ? panelTemplate(m.id, s) : placeholderTemplate(s);
      mainEl.appendChild(panel);
    });

    if(m.id === 'marketing'){
      const detailPanel = document.createElement('div');
      detailPanel.className = 'panel';
      detailPanel.id = 'panel-marketing-campaign-detail';
      detailPanel.innerHTML = `<div id="marketing-campaignDetailContent"></div>`;
      mainEl.appendChild(detailPanel);
    }

    view.appendChild(submenu);
    view.appendChild(mainEl);
    app.appendChild(view);
  });
}

}

/* ================= DASHBOARD ================= */
function renderDashboardHome(){
  const p = 'dashboard';
  const focusTitleEl = document.getElementById(`${p}-focusTitle`);
  if(!focusTitleEl) return;

  const statsGrid = document.getElementById(`${p}-statsGrid`);
  if(statsGrid){
    const activeTasksCount = tasks.filter(t=>!t.done).length;
    const unexploredIdeasCount = ideas.filter(i=>!i.explored).length;
    const activeCampaignsCount = campaigns.filter(c=>c.status==='Active' || c.status==='Planifiée').length;
    const openProspectsCount = prospects.filter(p=>p.stage!=='Gagné').length;
    statsGrid.innerHTML = `
      <div class="stat-card"><div class="stat-card-icon">${ic('ti-calendar-event',15)}</div><div class="val">${activeTasksCount}</div><div class="label">Tâches actives</div></div>
      <div class="stat-card blue"><div class="stat-card-icon">${ic('ti-bulb',15)}</div><div class="val">${unexploredIdeasCount}</div><div class="label">Idées à explorer</div></div>
      <div class="stat-card purple"><div class="stat-card-icon">${ic('ti-target-arrow',15)}</div><div class="val">${activeCampaignsCount}</div><div class="label">Campagnes en cours</div></div>
      <div class="stat-card green"><div class="stat-card-icon">${ic('ti-user-plus',15)}</div><div class="val">${openProspectsCount}</div><div class="label">Prospects en cours</div></div>`;
  }

  const activeTasks = tasks.filter(t => !t.done);
  const priorityTasks = activeTasks.filter(t => t.impact);
  const focusTasks = priorityTasks.length ? priorityTasks : activeTasks.slice(0,2);
  const toneEl = document.getElementById(`${p}-tone`);
  const focusContent = document.getElementById(`${p}-focusContent`);
  if(focusTasks.length === 0){
    focusTitleEl.textContent = `Focus du jour`;
    focusContent.innerHTML = `<p class="empty-hint">Rien de prioritaire pour l'instant. Ajoute une tâche dans le Planificateur quotidien pour la voir apparaître ici.</p>`;
    toneEl.textContent = `Une journée calme, pour l'instant.`;
  }else{
    const count = focusTasks.length;
    focusTitleEl.textContent = count === 1 ? `Une chose mérite ton énergie aujourd'hui` : `${count} choses méritent ton énergie aujourd'hui`;
    focusContent.innerHTML = focusTasks.map(t => `<div class="task-line"><input type="checkbox" disabled>${esc(t.title)}</div>`).join('');
    toneEl.textContent = count <= 2 ? `${count} sujet${count>1?'s':''} à traiter, rien qui déborde.` : `${count} sujets t'attendent aujourd'hui, mieux vaut commencer tôt.`;
  }
  const ideasContent = document.getElementById(`${p}-ideasContent`);
  ideasContent.innerHTML = ideas.length === 0
    ? `<p class="empty-hint">Aucune idée capturée pour l'instant.</p>`
    : ideas.slice(0,3).map(i => `<div class="idea-row"><span>${esc(i.text)}</span><span class="idea-date">${fmtDate(i.createdAt)}</span></div>`).join('');
  document.getElementById(`${p}-dateLabel`).textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}

/* ================= DAILY PLANNER ================= */
let pendingImpact = false;
function renderPlanner(){
  const content = document.getElementById('planner-content');
  if(!content) return;
  if(tasks.length === 0){ content.innerHTML = `<div class="empty">${ic('ti-sparkles',24)}Aucune tâche pour l'instant. Ajoute la première chose à faire aujourd'hui.</div>`; return; }
  const active = tasks.filter(t=>!t.done), done = tasks.filter(t=>t.done);
  const priority = active.filter(t=>t.impact), normal = active.filter(t=>!t.impact);
  const row = t => `<div class="row-card ${t.done?'':''}" style="${t.done?'opacity:.5':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTaskDone('${t.id}')" style="width:18px;height:18px;accent-color:var(--th-orange)">
    <span class="row-main" style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}</span>
    <button class="delete-btn" style="opacity:1;color:${t.impact?'#F97316':'#D1D5DB'}" onclick="toggleTaskImpact('${t.id}')">${ic(t.impact?"star-filled":"star",17)}</button>
    <button class="delete-btn" style="opacity:1" onclick="deleteTask('${t.id}')">${ic('ti-trash')}</button>
  </div>`;
  let html = '';
  if(priority.length) html += `<p class="section-label">Prioritaire</p><div class="row-list">${priority.map(row).join('')}</div>`;
  if(normal.length) html += `<p class="section-label">À faire</p><div class="row-list">${normal.map(row).join('')}</div>`;
  if(done.length) html += `<p class="section-label">Terminé</p><div class="row-list">${done.map(row).join('')}</div>`;
  content.innerHTML = html;
}
function addTask(){
  const input = document.getElementById('planner-taskInput'); const title = input.value.trim(); if(!title) return;
  tasks.unshift({ id:'task_'+Date.now(), title, impact:pendingImpact, done:false, createdAt:new Date().toISOString() });
  input.value=''; pendingImpact=false; document.getElementById('planner-impactToggle').classList.remove('active');
  saveKey('daily-planner:tasks', tasks); renderPlanner(); renderDashboardHome(); input.focus();
}
function toggleTaskDone(id){ const t=tasks.find(t=>t.id===id); if(t) t.done=!t.done; saveKey('daily-planner:tasks',tasks); renderPlanner(); renderDashboardHome(); }
function toggleTaskImpact(id){ const t=tasks.find(t=>t.id===id); if(t) t.impact=!t.impact; saveKey('daily-planner:tasks',tasks); renderPlanner(); renderDashboardHome(); }
function deleteTask(id){ tasks=tasks.filter(t=>t.id!==id); saveKey('daily-planner:tasks',tasks); renderPlanner(); renderDashboardHome(); }

   jamais une duplication de structure. Ce filtre traverse tous les

let currentSector = ACTIVE_SECTOR.id;

  if(currentSector === 'all') return true;

function campDiffusion(c){
  const d = c.diffusion||{};
  const chs = Object.keys(c.channelBudgets||{});
  if(!chs.length) return 'Non créée';
  const states = chs.map(ch=>(d[ch]&&d[ch].statut)||'Non créée');
  if(states.every(s=>s==='Active')) return 'Active';
  if(states.every(s=>s==='Terminée')) return 'Terminée';
  if(states.some(s=>s==='À créer'||s==='Non créée')) return 'À créer';
  if(states.some(s=>s==='En attente de validation')) return 'En attente de validation';
  return 'Créée';
}
function isReadyToLaunch(c){
  return checklistPct(c)===100 && campDiffusion(c)!=='Non créée' && campDiffusion(c)!=='À créer';
}

/* ---------- Calculs dérivés (jamais de double saisie) ---------- */
function campTotals(c){
  const r = c.results || {};
  return Object.values(r).reduce((a,x)=>({
    impressions:a.impressions+(x.impressions||0), clicks:a.clicks+(x.clicks||0),
    leads:a.leads+(x.leads||0), conversions:a.conversions+(x.conversions||0), cost:a.cost+(x.cost||0)
  }), {impressions:0,clicks:0,leads:0,conversions:0,cost:0});
}
function campChannels(c){ return Object.keys(c.results||{}); }
function cpl(t){ return t.leads>0 ? Math.round(t.cost/t.leads) : null; }
function convRate(t){ return t.leads>0 ? Math.round(t.conversions/t.leads*100) : 0; }
function segName(id){ const s = AUDIENCES.find(a=>a.id===id); return s ? s.nom : '—'; }
function statusBadge(s){
  const k = STATUS_STYLE[s]||'gray';
  const style = k==='purple'?'color:var(--th-purple);background:var(--th-purple-bg)':k==='orange'?'color:var(--th-orange);background:var(--th-orange-bg)':'';
  return `<span class="badge ${k}" style="${style}">${esc(s)}</span>`;
}
function aggregateByChannel(){
  const agg = {};
  sectorCampaigns().forEach(c => {
    Object.entries(c.results||{}).forEach(([ch,r]) => {
      if(!agg[ch]) agg[ch] = { impressions:0,clicks:0,leads:0,conversions:0,cost:0,campaigns:0,time:0 };
      const a = agg[ch];
      a.impressions+=r.impressions||0; a.clicks+=r.clicks||0; a.leads+=r.leads||0;
      a.conversions+=r.conversions||0; a.cost+=r.cost||0; a.campaigns++;
      a.time += (c.timeReal||0) / Math.max(1, Object.keys(c.results||{}).length);
    });
  });
  return agg;
}
function aggregateBySegment(){
  const agg = {};
  sectorCampaigns().forEach(c => {
    const t = campTotals(c);
    if(!agg[c.segmentId]) agg[c.segmentId] = { leads:0,conversions:0,cost:0,time:0,campaigns:0 };
    const a = agg[c.segmentId];
    a.leads+=t.leads; a.conversions+=t.conversions; a.cost+=t.cost; a.time+=(c.timeReal||0); a.campaigns++;
  });
  return agg;
}

  return Math.ceil((new Date(iso) - new Date()) / 86400000);
}

    if(c.status==='En ligne' && t.cost>200 && t.leads===0)
      alerts.push({ txt:`<b>${esc(c.title)}</b> n'a généré aucun lead malgré ${t.cost} € dépensés.`, id:c.id });
    if(t.leads>0 && (t.cost/t.leads)>MKTG_SETTINGS.seuils.coutLeadMax)
      alerts.push({ txt:`<b>${esc(c.title)}</b> dépasse l'objectif de coût par lead (${Math.round(t.cost/t.leads)} ${MKTG_SETTINGS.devise} contre ${MKTG_SETTINGS.seuils.coutLeadMax} ${MKTG_SETTINGS.devise} visés).`, id:c.id });
    if(c.budget>0 && t.cost>c.budget)
      alerts.push({ txt:`<b>${esc(c.title)}</b> a dépassé son budget de ${t.cost-c.budget} €.`, id:c.id });
    if(c.timeEstimated>0 && c.timeReal>c.timeEstimated*1.3)
      alerts.push({ txt:`<b>${esc(c.title)}</b> a demandé ${c.timeReal} h au lieu des ${c.timeEstimated} h estimées.`, id:c.id });
  });
  if(contentsToCreate.length) alerts.push({ txt:`<b>${contentsToCreate.length} contenus</b> ne sont pas encore prêts alors que le lancement approche.`, section:'contents' });
  const lpMissing = LAUNCH_CHECKLIST.find(x=>x.label==='Landing page' && x.done<x.total);
  if(lpMissing) alerts.push({ txt:`La <b>landing page</b> n'est pas publiée alors que des campagnes sont prêtes à partir.`, section:'contents' });

  const zoneAlertes = `
    <div class="zone-label zone-red">${ic('ti-alert-triangle',14)} Alertes</div>

      <div class="card-header"><div class="card-title">${ic('ti-alert-triangle',17)}<span>Ce qui nécessite une décision</span></div>
        ${alerts.length?`<span class="badge red">${alerts.length}</span>`:''}</div>
      ${alerts.length
        ? alerts.slice(0,6).map(a=>`<div class="alert warn" onclick="${a.id?`openCampaignDetail('${a.id}')`:`gotoMktg('${a.section}')`}" style="cursor:pointer"><div class="alert-icon">${ic('ti-alert-triangle',14)}</div><div class="alert-text">${a.txt}</div></div>`).join('')
        : `<div class="alert opp"><div class="alert-icon">${ic('ti-circle-check',14)}</div><div class="alert-text">Rien ne nécessite votre attention pour le moment.</div></div>`}
    </div>`;

  /* ========== ZONE 7 — OBJECTIFS ========== */
  const weeksElapsed = 6, weeksLeft = 7;
  const objectifs = [
    { nom:'Leads du trimestre', actuel:totals.leads, cible:800, unite:'' },
    { nom:'Clients signés', actuel:totals.conv, cible:60, unite:'' },

  ];
  const zoneObjectifs = `
    <div class="zone-label zone-blue">${ic('ti-target',14)} Objectifs</div>
    <div class="card">
      <div class="card-header"><div class="card-title">${ic('ti-target',17)}<span>Progression et rythme</span></div>
        <span class="card-link" onclick="selectModule('okr')">Objectifs &amp; OKR →</span></div>
      ${objectifs.map(o=>{
        const pct = Math.min(100, Math.round(o.actuel/o.cible*100));
        const rythmeActuel = Math.round(o.actuel/weeksElapsed);
        const rythmeNecessaire = Math.ceil(Math.max(0,(o.cible-o.actuel))/weeksLeft);
        const ok = o.inverse ? rythmeActuel<=rythmeNecessaire : rythmeActuel>=rythmeNecessaire;
        return `<div style="margin-bottom:18px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
            <span style="font-size:13px;font-weight:700">${o.nom}</span>
            <span style="font-size:12px;color:var(--th-text-2)"><b style="color:var(--th-text)">${o.actuel}${o.unite}</b> / ${o.cible}${o.unite} · ${pct}%</span></div>
          <div style="background:var(--th-bg-alt);border-radius:8px;height:8px;overflow:hidden;margin-bottom:7px">
            <div style="height:100%;border-radius:8px;width:${pct}%;background:${ok?'linear-gradient(90deg,#4ADE80,var(--th-green))':'linear-gradient(90deg,#FDBA74,var(--th-orange))'}"></div></div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--th-text-2);flex-wrap:wrap">
            <span>Rythme actuel : <b style="color:var(--th-text)">${rythmeActuel}${o.unite}/sem.</b></span>
            <span>Nécessaire : <b style="color:var(--th-text)">${rythmeNecessaire}${o.unite}/sem.</b></span>
            <span class="badge ${ok?'green':'orange'}" style="${ok?'':'color:var(--th-orange);background:var(--th-orange-bg)'};margin-left:auto">${ok?'Rythme suffisant':'Rythme insuffisant'}</span>
          </div></div>`;
      }).join('')}
    </div>`;

  /* ========== ASSEMBLAGE ==========
     Avant lancement : préparer d'abord. Après : mesurer d'abord. */
  el.innerHTML = sectorSelector() + (preLaunch
    ? zoneContexte + zoneLancement + zonePriorites + zoneSemaine + zonePerformance + zoneAlertes + zoneObjectifs
    : zoneContexte + zonePerformance + zoneAlertes + zonePriorites + zoneSemaine + zoneObjectifs);
}

  }
  else if(audienceTab === 1){
    body = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:18px">
      ${SECTORS.map(s=>`<div class="card" style="${s.actif?'border-left:3px solid var(--th-orange)':'opacity:.6'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:15px;font-weight:700">${esc(s.nom)}</div>
          ${s.actif?'<span class="badge green">Actif</span>':'<span class="badge gray">À venir</span>'}</div>
        <div style="font-size:12.5px;color:var(--th-text-2);margin-bottom:12px">${esc(s.libelle)}</div>
        <div style="font-size:12px;color:var(--th-text-2);line-height:1.9">
          <div style="display:flex;justify-content:space-between"><span>Segments</span><b style="color:var(--th-text)">${AUDIENCES.filter(a=>a.sectorId===s.id).length}</b></div>
          <div style="display:flex;justify-content:space-between"><span>Campagnes</span><b style="color:var(--th-text)">${campaigns.filter(c=>c.sectorId===s.id).length}</b></div>
        </div></div>`).join('')}</div>
      <p class="section-label">Segments du secteur actif</p>
      <table class="data-table"><thead><tr><th>Segment</th><th>Secteur</th><th>Taille</th><th>Zone</th><th>Maturité</th><th>Phase</th><th>Messages</th><th>Potentiel</th></tr></thead><tbody>
        ${sectorAudiences().map(a=>`<tr onclick="openSegment('${a.id}')" style="cursor:pointer">
          <td class="dt-title">${esc(a.nom)}</td><td>${sectorBadge(a.sectorId)}</td>
          <td>${esc(a.taille)}</td><td>${esc(a.zone)}</td><td>${esc(a.maturite)}</td>
          <td><span class="badge blue">${esc(a.phase)}</span></td><td>${segMessages(a.id).length}</td>
          <td><span class="badge ${a.potentiel==='Élevé'?'green':'gray'}">${esc(a.potentiel)}</span></td></tr>`).join('')}
      </tbody></table>
      <div class="hint-bar" style="margin-top:16px">${ic('ti-bulb',16)}<span>Un segment se définit ici <b>une seule fois</b>. Une campagne le sélectionne, elle ne le redéfinit jamais.</span></div>`;
  }
  else if(audienceTab === 2){
    body = `
      <div class="grid-2">
        <div class="card"><div class="card-header"><div class="card-title">${ic('ti-circle-check',17)}<span>Ce qui fait réagir</span></div></div>
          ${MESSAGES.filter(m=>m.verdict==='fonctionne').map(m=>`<div class="msg-card works" style="margin-bottom:10px">
            <div style="font-size:13px;font-weight:700;line-height:1.5;margin-bottom:7px">« ${esc(m.texte)} »</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="badge">${esc(segName(m.segmentId))}</span>
            <span class="badge">${esc(m.angle)}</span><span class="badge green">${m.leads} leads</span></div>
            <div style="font-size:12px;color:var(--th-text-2);line-height:1.6">${esc(m.pourquoi)}</div></div>`).join('')}
        </div>
        <div class="card"><div class="card-header"><div class="card-title">${ic('ti-circle-x',17)}<span>Ce qui ne fonctionne pas</span></div></div>
          ${MESSAGES.filter(m=>m.verdict!=='fonctionne').map(m=>`<div class="msg-card ${m.verdict==='ne fonctionne pas'?'fails':''}" style="margin-bottom:10px">
            <div style="font-size:13px;font-weight:700;line-height:1.5;margin-bottom:7px">« ${esc(m.texte)} »</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="badge">${esc(segName(m.segmentId))}</span>
            <span class="badge">${esc(m.angle)}</span>${verdictBadge(m.verdict)}</div>
            <div style="font-size:12px;color:var(--th-text-2);line-height:1.6">${esc(m.pourquoi)}</div></div>`).join('')}
        </div>
      </div>
      <p class="section-label">Tous les messages testés</p>
      <table class="data-table"><thead><tr><th>Message</th><th>Segment</th><th>Angle</th><th>Canal</th><th>Clics</th><th>Leads</th><th>Verdict</th></tr></thead><tbody>
        ${MESSAGES.map(m=>`<tr onclick="openSegment('${m.segmentId}')" style="cursor:pointer"><td class="dt-title">« ${esc(m.texte)} »</td>
          <td style="font-size:12px;color:var(--th-text-2)">${esc(segName(m.segmentId))}</td><td><span class="badge">${esc(m.angle)}</span></td>
          <td>${esc(m.canal)}</td><td>${m.clicks}</td><td>${m.leads}</td><td>${verdictBadge(m.verdict)}</td></tr>`).join('')}
      </tbody></table>`;
  }
  else if(audienceTab === 3){
    body = `
      <table class="data-table"><thead><tr><th>Objection</th><th>Segment</th><th>Fréquence</th><th>Réponse qui marche</th><th>Efficacité</th></tr></thead><tbody>
        ${OBJECTIONS.map(o=>`<tr onclick="openSegment('${o.segmentId}')" style="cursor:pointer">
          <td class="dt-title">« ${esc(o.objection)} »</td>
          <td style="font-size:12px;color:var(--th-text-2)">${esc(segName(o.segmentId))}</td>
          <td><span class="badge ${o.frequence==='Très fréquente'?'red':o.frequence==='Fréquente'?'orange':'gray'}" style="${o.frequence==='Fréquente'?'color:var(--th-orange);background:var(--th-orange-bg)':''}">${esc(o.frequence)}</span></td>
          <td style="font-size:12.5px;color:var(--th-text-2);max-width:340px">${esc(o.reponse)}</td>
          <td><span class="badge ${o.efficacite==='Efficace'?'green':o.efficacite==='À améliorer'?'orange':'gray'}" style="${o.efficacite==='À améliorer'?'color:var(--th-orange);background:var(--th-orange-bg)':''}">${esc(o.efficacite)}</span></td></tr>`).join('')}
      </tbody></table>
      <div class="hint-bar" style="margin-top:16px">${ic('ti-bulb',16)}<span>Ces réponses alimentent directement vos <b>scripts commerciaux</b> et vos contenus marketing.</span></div>`;
  }
  else if(audienceTab === 4){
    body = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="add-btn">${ic('ti-plus',14)} Nouvel apprentissage</button></div>
      ${INSIGHTS.map(i=>`<div class="insight-card" onclick="openSegment('${i.segmentId}')" style="cursor:pointer">
        <div class="insight-icon">${ic('ti-bulb',15)}</div>
        <div style="flex:1"><div style="font-size:13.5px;line-height:1.65;margin-bottom:7px">${esc(i.texte)}</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap"><span class="badge">${esc(segName(i.segmentId))}</span>
        <span class="badge">${esc(i.source)}</span><span class="badge">${fmtDate(i.date)}</span>
        <span class="badge ${i.impact==='Fort'?'green':'gray'}">Impact ${esc(i.impact)}</span></div></div>
      </div>`).join('')}
      <div class="hint-bar" style="margin-top:16px">${ic('ti-bulb',16)}<span>Chaque apprentissage vient d'une <b>source réelle</b> : entretien, appel, observation ou analyse. Rien n'est supposé.</span></div>`;
  }
  else {
    body = `
      <table class="data-table"><thead><tr><th>Segment</th><th>Campagnes</th><th>Leads</th><th>Clients</th><th>Taux</th><th>Coût / lead</th><th>Temps</th><th>Messages testés</th><th>Potentiel</th></tr></thead><tbody>
        ${sectorAudiences().map(a=>{ const s = segAgg[a.id]||{leads:0,conversions:0,cost:0,time:0,campaigns:0};
          return `<tr onclick="openSegment('${a.id}')" style="cursor:pointer"><td class="dt-title">${esc(a.nom)}</td>
          <td>${s.campaigns}</td><td>${s.leads}</td><td>${s.conversions}</td>
          <td><span class="badge ${s.leads&&s.conversions/s.leads>0.1?'green':'gray'}">${s.leads?Math.round(s.conversions/s.leads*100):0}%</span></td>
          <td>${s.leads?Math.round(s.cost/s.leads)+' €':'—'}</td><td>${s.time} h</td>
          <td>${segMessages(a.id).length}</td>
          <td><span class="badge ${a.potentiel==='Élevé'?'green':'gray'}">${esc(a.potentiel)}</span></td></tr>`; }).join('')}
      </tbody></table>
      <div class="hint-bar" style="margin-top:16px">${ic('ti-bulb',16)}<span>Ces chiffres sont <b>calculés depuis les campagnes</b>, jamais saisis ici. Un segment ne « possède » pas de résultats : il en reçoit.</span></div>`;
  }

  el.innerHTML = sectorSelector() + `<div class="tabs">${tabs.map((t,i)=>`<div class="tab${i===audienceTab?' active':''}" onclick="switchAudienceTab(${i})">${t}</div>`).join('')}</div>${body}`;
}

/* ---- 3. Plan de campagnes ----
   Hiérarchie UX : décision en haut · action au milieu · calendrier · détail en bas.
   La page doit dire quoi faire, pas seulement montrer des chiffres. */

let campView = 'Toutes';
let campSearch = '';
let campFilterChannel = 'Tous';
let campFilterObjective = 'Tous';
function setCampView(v){ campView = v; renderMktgCampaigns(); }
function setCampSearch(v){ campSearch = v.toLowerCase(); renderMktgCampaigns(); }
function setCampChannel(v){ campFilterChannel = v; renderMktgCampaigns(); }
function setCampObjective(v){ campFilterObjective = v; renderMktgCampaigns(); }

function checklistPct(c){
  if(!c.checklist) return 0;
  return Math.round(c.checklist.filter(x=>x).length / c.checklist.length * 100);
}
function missingItems(c){
  if(!c.checklist) return [];
  return CHECKLIST_ITEMS.filter((_,i)=>!c.checklist[i]);
}
function daysToStart(c){
  if(!c.startDate) return null;
  return Math.ceil((new Date(c.startDate) - new Date()) / 86400000);
}

function renderMktgCampaigns(){
  const el = document.getElementById('marketing-campaignsContent'); if(!el) return;

  const scoped = sectorCampaigns();
  const online = scoped.filter(c=>c.status==='En ligne');
  const toPrep = scoped.filter(c=>c.status==='Brouillon'||c.status==='En préparation');
  const upcoming = scoped.filter(c=>c.status==='Planifiée');
  const budgetPrevu = scoped.filter(c=>c.status!=='Terminée'&&c.status!=='Annulée').reduce((s,c)=>s+(c.budget||0),0);
  const totalLeads = scoped.reduce((s,c)=>s+campTotals(c).leads,0);

  /* ===== 1. BANDEAU AUJOURD'HUI ===== */
  const bandeau = `
    <div class="today-bar">
      <div class="today-item"><span class="today-dot" style="background:var(--th-green)"></span><b>${online.length}</b> en ligne</div>
      <div class="today-item"><span class="today-dot" style="background:var(--th-orange)"></span><b>${toPrep.length}</b> à préparer</div>
      <div class="today-item"><span class="today-dot" style="background:var(--th-blue)"></span><b>${upcoming.length}</b> prévue${upcoming.length>1?'s':''}</div>
      <div class="today-item" style="border-left:1px solid var(--th-border);padding-left:20px">${sectorBadge(ACTIVE_SECTOR.id)}</div>
      <button class="btn-ghost" style="margin-left:auto" onclick="document.getElementById('todo-block').scrollIntoView({behavior:'smooth'})">Voir les actions du jour →</button>
      <div style="position:relative">
        <button class="add-btn" onclick="toggleCreateMenu()">${ic('ti-plus',14)} Nouvelle campagne</button>
        <div id="camp-create-menu" class="create-menu">
          <div class="create-item" onclick="openCampaignWizard()">${ic('ti-target-arrow',15)}<div><div style="font-weight:700">Créer une campagne</div><div style="font-size:11px;color:var(--th-text-2)">Parcours guidé en 6 étapes</div></div></div>
          <div class="create-item" onclick="openWizardFromIdea()">${ic('ti-bulb',15)}<div><div style="font-weight:700">Créer depuis une idée</div><div style="font-size:11px;color:var(--th-text-2)">Depuis la Boîte à idées</div></div></div>
          <div class="create-item" onclick="openImportModal()">${ic('ti-arrow-left',15)}<div><div style="font-weight:700">Importer une campagne</div><div style="font-size:11px;color:var(--th-text-2)">Existe déjà sur une plateforme</div></div></div>
        </div>
      </div>
    </div>`;

  /* ===== 2. KPI ===== */
  const kpis = `
    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card green"><div class="stat-card-icon">${ic('ti-circle-check')}</div><div class="val">${online.length}</div><div class="label">En ligne</div></div>
      <div class="stat-card"><div class="stat-card-icon">${ic('ti-tools')}</div><div class="val">${toPrep.length}</div><div class="label">À préparer</div></div>
      <div class="stat-card blue"><div class="stat-card-icon">${ic('ti-calendar')}</div><div class="val">${upcoming.length}</div><div class="label">À venir</div></div>
      <div class="stat-card purple"><div class="stat-card-icon">${ic('ti-wallet')}</div><div class="val">${budgetPrevu} €</div><div class="label">Budget prévu</div></div>
      <div class="stat-card"><div class="stat-card-icon">${ic('ti-users')}</div><div class="val">${totalLeads}</div><div class="label">Leads générés</div></div>
    </div>`;

  /* ===== 3. À FAIRE MAINTENANT ===== */
  const todos = [];
  scoped.forEach(c=>{
    const d = daysToStart(c);
    const miss = missingItems(c);
    if(c.status==='Brouillon' && !c.budget)
      todos.push({ urgence:'haute', titre:c.title, raison:'Budget non défini', detail:`${esc(segName(c.segmentId))}`, action:'Compléter', id:c.id });
    else if((c.status==='Planifiée'||c.status==='En préparation') && d!==null && d>=0 && d<=7 && miss.length)
      todos.push({ urgence:'moyenne', titre:c.title, raison:`Mise en ligne dans ${d} jour${d>1?'s':''} · ${miss.length} élément${miss.length>1?'s':''} manquant${miss.length>1?'s':''}`, detail:`${c.budget} € · ${esc(segName(c.segmentId))}`, action:'Préparer la campagne', id:c.id });
    else if(c.status==='Brouillon' && miss.length>=4)
      todos.push({ urgence:'moyenne', titre:c.title, raison:`${miss.length} éléments manquants avant de pouvoir lancer`, detail:`${esc(segName(c.segmentId))}`, action:'Compléter', id:c.id });
  });
  sectorContents().filter(ct=>ct.statut==='À créer'||ct.statut==='À préparer').slice(0,2).forEach(ct=>{
    todos.push({ urgence:'moyenne', titre:ct.titre, raison:`Contenu ${ct.statut.toLowerCase()} · publication prévue le ${fmtDate(ct.date)}`, detail:esc(ct.canal), action:'Voir le contenu', section:'contents' });
  });

  const blocTodo = `
    <div class="card" id="todo-block">
      <div class="card-header"><div class="card-title">${ic('ti-bolt',17)}<span>À faire maintenant</span></div>
        ${todos.length?`<span class="badge ${todos.some(t=>t.urgence==='haute')?'red':'orange'}" style="${todos.some(t=>t.urgence==='haute')?'':'color:var(--th-orange);background:var(--th-orange-bg)'}">${todos.length}</span>`:''}</div>
      ${todos.length ? todos.slice(0,5).map(t=>`
        <div class="todo-row" onclick="${t.id?`openCampaignDetail('${t.id}')`:`gotoMktg('${t.section}')`}">
          <span class="todo-dot" style="background:${t.urgence==='haute'?'var(--th-red)':'var(--th-orange)'}"></span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;font-weight:700;margin-bottom:3px">${esc(t.titre)}</div>
            <div style="font-size:12px;color:var(--th-text-2)">${t.raison}</div>
            <div style="font-size:11.5px;color:var(--th-text-3);margin-top:2px">${t.detail}</div>
          </div>
          <span class="todo-action">${t.action} →</span>
        </div>`).join('')
        : `<div class="alert opp"><div class="alert-icon">${ic('ti-circle-check',14)}</div><div class="alert-text">Rien ne nécessite votre attention immédiate.</div></div>`}
    </div>`;

  /* ===== 4. PROCHAINS LANCEMENTS ===== */
  const launches = scoped
    .filter(c=>['Brouillon','En préparation','Planifiée'].includes(c.status) && c.startDate)
    .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))
    .slice(0,5);
  const blocLaunches = `
    <div class="card">
      <div class="card-header"><div class="card-title">${ic('ti-rocket',17)}<span>Prochains lancements</span></div></div>
      ${launches.length ? launches.map(c=>{
        const pct = checklistPct(c);
        const d = daysToStart(c);
        return `<div class="launch-row" onclick="openCampaignDetail('${c.id}')">
          <div class="launch-date">
            <div style="font-size:16px;font-weight:800;line-height:1">${new Date(c.startDate).getDate()}</div>
            <div style="font-size:10px;color:var(--th-text-3);text-transform:uppercase;font-weight:700">${new Date(c.startDate).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</div>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;margin-bottom:4px">${esc(c.title)}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="flex:1;max-width:150px;background:var(--th-bg-alt);border-radius:6px;height:6px;overflow:hidden">
                <div style="height:100%;width:${pct}%;border-radius:6px;background:${pct===100?'var(--th-green)':'var(--th-orange)'}"></div></div>
              <span style="font-size:11.5px;font-weight:700;color:${pct===100?'var(--th-green)':'var(--th-orange)'}">${pct}% prêt</span>
            </div>
          </div>
          ${d!==null && d>=0 ? `<span class="badge ${d<=3?'red':'gray'}">${d===0?"Aujourd'hui":`J-${d}`}</span>` : statusBadge(c.status)}
        </div>`;
      }).join('') : '<p class="empty-hint">Aucun lancement planifié.</p>'}
    </div>`;

  /* ===== 5. FILTRES ===== */
  const views = {
    'Toutes':()=>true,
    'Prêtes à lancer':c=>isReadyToLaunch(c) && c.status!=='En ligne' && c.status!=='Terminée',
    'À créer sur plateforme':c=>Object.values(c.diffusion||{}).some(d=>d.statut==='Non créée'||d.statut==='À créer'),
    'À faire':c=>c.status==='Brouillon'||c.status==='En préparation',
    'À venir':c=>c.status==='Planifiée',
    'En ligne':c=>c.status==='En ligne',
    'En pause':c=>c.status==='En pause',
    'Terminées':c=>c.status==='Terminée'
  };
  const usedChannels = [...new Set(scoped.flatMap(c=>Object.keys(c.channelBudgets||{})))];
  const filtres = `
    <div class="filter-bar" style="margin-top:26px">
      ${Object.keys(views).map(v=>`<button class="filter-chip${campView===v?' active':''}" onclick="setCampView('${v}')">${v}</button>`).join('')}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <div class="search-bar" style="margin-bottom:0;max-width:280px">${ic('ti-search')}<input type="text" placeholder="Rechercher..." oninput="setCampSearch(this.value)"></div>
      <select class="status-select" onchange="setCampChannel(this.value)">
        <option ${campFilterChannel==='Tous'?'selected':''}>Tous</option>
        ${usedChannels.map(ch=>`<option ${campFilterChannel===ch?'selected':''}>${esc(ch)}</option>`).join('')}
      </select>
      <select class="status-select" onchange="setCampObjective(this.value)">
        <option ${campFilterObjective==='Tous'?'selected':''}>Tous</option>
        ${CAMPAIGN_OBJECTIVES.map(o=>`<option ${campFilterObjective===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
    </div>`;

  /* ===== 6. LISTE ===== */
  let list = scoped.filter(views[campView]||(()=>true));
  if(campSearch) list = list.filter(c=>c.title.toLowerCase().includes(campSearch));
  if(campFilterChannel!=='Tous') list = list.filter(c=>Object.keys(c.channelBudgets||{}).includes(campFilterChannel));
  if(campFilterObjective!=='Tous') list = list.filter(c=>c.objective===campFilterObjective);

  const rows = list.map(c=>{
    const chs = Object.keys(c.channelBudgets||{});
    const pct = checklistPct(c);
    return `<tr onclick="openCampaignDetail('${c.id}')" style="cursor:pointer">
      <td><div class="dt-title">${esc(c.title)}</div><div class="dt-sub">${esc(c.objective||'')}</div></td>
      <td style="font-size:12.5px;color:var(--th-text-2);cursor:pointer" onclick="event.stopPropagation();goToAudience('${c.segmentId}')">${esc(segName(c.segmentId))} →</td>
      <td>${chs.length ? chs.slice(0,2).map(ch=>{const st=CHANNEL_STYLE[ch]||{};return `<span class="badge" style="background:${st.tint||'var(--th-bg-alt)'};color:${st.c||'var(--th-text-2)'};cursor:pointer" onclick="event.stopPropagation();goToChannel('${ch}')">${esc(ch)}</span>`;}).join(' ')+(chs.length>2?` <span class="badge">+${chs.length-2}</span>`:'') : '<span style="color:var(--th-text-3)">—</span>'}</td>
      <td style="font-size:12px;color:var(--th-text-2);white-space:nowrap">${c.startDate?fmtDate(c.startDate):'—'}${c.endDate?' → '+fmtDate(c.endDate):''}</td>
      <td style="white-space:nowrap">${c.budget||0} €</td>
      <td style="width:110px"><div style="display:flex;align-items:center;gap:7px">
        <div style="flex:1;background:var(--th-bg-alt);border-radius:5px;height:5px;overflow:hidden"><div style="height:100%;width:${pct}%;border-radius:5px;background:${pct===100?'var(--th-green)':'var(--th-orange)'}"></div></div>
        <span style="font-size:11px;color:var(--th-text-2);font-weight:700">${pct}%</span></div></td>
      <td>${diffusionBadge(campDiffusion(c))}</td>
      <td>${statusBadge(c.status)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = sectorSelector() + bandeau + kpis
    + `<div class="grid-2">${blocTodo}${blocLaunches}</div>`
    + filtres
    + `<table class="data-table"><thead><tr><th>Campagne</th><th>Cible</th><th>Canaux</th><th>Dates</th><th>Budget</th><th>Préparation</th><th>Diffusion</th><th>Statut TigerHub</th></tr></thead>
       <tbody>${rows || `<tr><td colspan="8" style="text-align:center;color:var(--th-text-2);padding:26px">Aucune campagne dans cette vue.</td></tr>`}</tbody></table>`;
}

/* ==================== ACTIONS CAMPAGNES ====================
   TigerHub planifie, les plateformes exécutent.
   Aucune API : les boutons ouvrent la console de la plateforme
   dans un nouvel onglet et l'identifiant se saisit à la main. */

/* ---- Menu de création ---- */
function openWizardFromIdea(){
  const unexplored = ideas.filter(i=>!i.explored);
  const m = document.getElementById('camp-create-menu'); if(m) m.style.display='none';
  if(!unexplored.length){
    alert("Aucune idée en attente dans la Boîte à idées.\n\nCapturez d'abord une idée, elle apparaîtra ici.");
    return;
  }
  const list = unexplored.map((i,n)=>`${n+1}. ${i.text}`).join('\n');
  const pick = prompt("Depuis quelle idée ?\n\n"+list+"\n\nEntrez le numéro :");
  const idx = parseInt(pick,10)-1;
  if(isNaN(idx)||!unexplored[idx]) return;
  const idea = unexplored[idx];
  idea.explored = true;
  saveKey('idea-box:ideas', ideas);
  if(typeof renderIdeaBox==='function') renderIdeaBox();
  openCampaignWizard(idea.text);
}
function toggleCreateMenu(){
  const m = document.getElementById('camp-create-menu');
  if(m) m.style.display = m.style.display==='block' ? 'none' : 'block';
}

/* ---- Assistant de création en 6 étapes ---- */
let wizStep = 0;
let wizData = null;
function openCampaignWizard(fromIdea){
  wizStep = 0;
  wizData = {
    title:'', objective:'', sectorId:ACTIVE_SECTOR.id, segmentId:'', channels:{},
    offre:'', message:'', cta:'', landing:'',
    budget:0, startDate:'', endDate:'', timeEstimated:0, timeGestion:0,
    sourceIdeaText: fromIdea || ''
  };
  if(fromIdea){ wizData.title = fromIdea; }
  const m = document.getElementById('camp-create-menu'); if(m) m.style.display='none';
  document.getElementById('wizard-overlay').classList.add('open');
  renderWizard();
}
function closeWizard(){ document.getElementById('wizard-overlay').classList.remove('open'); }
function wizNext(){ if(wizStep<5){ wizStep++; renderWizard(); } }
function wizPrev(){ if(wizStep>0){ wizStep--; renderWizard(); } }
function wizSet(field, val){ wizData[field] = val; renderWizard(); }
function wizToggleChannel(ch){
  if(wizData.channels[ch]!==undefined) delete wizData.channels[ch];
  else wizData.channels[ch] = 0;
  renderWizard();
}
function wizSetChannelBudget(ch, val){ wizData.channels[ch] = Number(val)||0; }

function renderWizard(){
  const el = document.getElementById('wizard-body'); if(!el) return;
  const steps = ['Objectif','Secteur','Audience','Canaux','Offre & message','Budget & dates'];
  let body = '';

  if(wizStep===0){
    body = `<p class="wiz-q">Que veux-tu obtenir avec cette campagne ?</p>
      <input type="text" class="wiz-input" placeholder="Nom de la campagne..." value="${esc(wizData.title)}" oninput="wizData.title=this.value">
      <div class="wiz-grid">
        ${CAMPAIGN_OBJECTIVES.map(o=>`<div class="wiz-opt ${wizData.objective===o?'sel':''}" onclick="wizSet('objective','${o}')">${esc(o)}</div>`).join('')}
      </div>`;
  }
  else if(wizStep===1){
    body = `<p class="wiz-q">Pour quel secteur ?</p>
      <div class="wiz-grid">
        ${SECTORS.map(s=>`<div class="wiz-opt ${s.actif?(wizData.sectorId===s.id?'sel':''):'disabled'}" ${s.actif?`onclick="wizSet('sectorId','${s.id}')"`:''}>
          <div style="font-weight:700">${esc(s.nom)}</div>
          <div style="font-size:11px;color:var(--th-text-3);margin-top:3px">${s.actif?'Actif':'À venir'}</div></div>`).join('')}
      </div>
      <div class="hint-bar" style="margin-top:16px">${ic('ti-bulb',15)}<span>Seule la dératisation est active en V1. Les autres secteurs seront activés progressivement.</span></div>`;
  }
  else if(wizStep===2){
    body = `<p class="wiz-q">À qui s'adresse cette campagne ?</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${AUDIENCES.filter(a=>a.sectorId===wizData.sectorId).map(a=>`
          <div class="wiz-opt ${wizData.segmentId===a.id?'sel':''}" style="text-align:left" onclick="wizSet('segmentId','${a.id}')">
            <div style="font-weight:700;margin-bottom:3px">${esc(a.nom)}</div>
            <div style="font-size:11.5px;color:var(--th-text-2)">${esc(a.taille)} · ${esc(a.zone)} · potentiel ${esc(a.potentiel)}</div>
          </div>`).join('')}

  }
  else if(wizStep===3){
    body = `<p class="wiz-q">Sur quels canaux ?</p>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${MKTG_CHANNELS.map(ch=>{
          const sel = wizData.channels[ch]!==undefined; const st = CHANNEL_STYLE[ch]||{};
          return `<div class="wiz-chan ${sel?'sel':''}">
            <div style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer" onclick="wizToggleChannel('${ch}')">
              <div class="check-dot" style="${sel?'background:var(--th-green);border-color:var(--th-green);color:#fff':''}">${sel?ic('ti-circle-check',11):''}</div>
              <div style="width:26px;height:26px;border-radius:8px;background:${st.tint||'var(--th-bg-alt)'};display:flex;align-items:center;justify-content:center;color:${st.c||'var(--th-text-3)'}">${ic(st.icon||'ti-target',14)}</div>
              <span style="font-size:13px;font-weight:600">${esc(ch)}</span></div>
            ${sel?`<input class="stat-input" type="number" placeholder="0" value="${wizData.channels[ch]||''}" onchange="wizSetChannelBudget('${ch}',this.value)"> €`:''}
          </div>`;
        }).join('')}
      </div>`;
  }
  else if(wizStep===4){
    body = `<p class="wiz-q">Quelle offre et quel message ?</p>
      <label class="wiz-lab">Offre</label>
      <input type="text" class="wiz-input" placeholder="Ex : 2 mois offerts" value="${esc(wizData.offre)}" oninput="wizData.offre=this.value">
      <label class="wiz-lab">Message principal</label>
      <input type="text" class="wiz-input" placeholder="La phrase qui doit faire réagir..." value="${esc(wizData.message)}" oninput="wizData.message=this.value">
      <label class="wiz-lab">Appel à l'action</label>
      <input type="text" class="wiz-input" placeholder="Ex : Demander une démonstration" value="${esc(wizData.cta)}" oninput="wizData.cta=this.value">

      <input type="text" class="wiz-input" placeholder="https://..." value="${esc(wizData.landing)}" oninput="wizData.landing=this.value">`;

  }

  el.innerHTML = `
    <div class="wiz-steps">
      ${steps.map((s,i)=>`<div class="wiz-step ${i===wizStep?'cur':i<wizStep?'done':''}">
        <div class="wiz-num">${i<wizStep?ic('ti-circle-check',12):i+1}</div><span>${s}</span></div>`).join('')}
    </div>
    <div class="wiz-body">${body}</div>
    <div class="wiz-foot">
      <button class="btn-ghost" onclick="${wizStep===0?'closeWizard()':'wizPrev()'}">${wizStep===0?'Annuler':'← Retour'}</button>

                  : `<button class="add-btn" onclick="createCampaignFromWizard()">Créer la campagne</button>`}
    </div>`;
}

function createCampaignFromWizard(){
  const d = wizData;
  if(!d.title.trim()){ alert("Donnez un nom à la campagne."); wizStep=0; return renderWizard(); }
  const diffusion = {};
  Object.keys(d.channels).forEach(ch=>{ diffusion[ch] = {statut:'Non créée',extId:'',url:''}; });
  const checklist = [
    d.objective?1:0, d.segmentId?1:0, d.budget>0?1:0, d.startDate?1:0, d.message?1:0,
    0, d.landing?1:0, 0, 0, 0
  ];
  campaigns.unshift({
    id:'mktg_'+Date.now(), title:d.title.trim(), sectorId:d.sectorId, objective:d.objective,
    segmentId:d.segmentId||AUDIENCES[0].id, status:'Brouillon',
    startDate:d.startDate, endDate:d.endDate, budget:d.budget,
    timeEstimated:d.timeEstimated, timeReal:0, responsable:'Sophie',
    offre:d.offre, message:d.message, cta:d.cta, landing:d.landing,
    targets:{ leads:0, clients:0, cpl:0 },
    checklist, channelBudgets:{...d.channels}, diffusion,
    utm:{ source:'', medium:'', campaign:d.title.toLowerCase().replace(/[^a-z0-9]+/g,'-'), content:'', term:'' },
    results:{}, notes:'', sourceIdeaText:d.sourceIdeaText||null,
    createdAt:new Date().toISOString()
  });
  saveKey('marketing-os:actions', campaigns);
  closeWizard(); refreshMktgAll();
  openCampaignDetail(campaigns[0].id);
}
